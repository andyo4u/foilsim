<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Experiment 1: Wind-Forced Wave Propagation</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { overflow: hidden; background: #0a0c10; font-family: 'JetBrains Mono', monospace; touch-action: none; }
  canvas { display: block; width: 100vw; height: 100vh; cursor: crosshair; }
  
  #fps { position: fixed; top: 12px; left: 12px; z-index: 20; background: rgba(8, 10, 18, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(100, 160, 255, 0.15); border-radius: 8px; padding: 8px 12px; color: #c0d0e8; font-size: 10px; pointer-events: none; }
  #fps .fps-value { color: #4a90d9; font-weight: 500; font-size: 14px; }
  
  #controls { position: fixed; top: 12px; right: 12px; width: 300px; max-height: calc(100vh - 24px); overflow-y: auto; background: rgba(8, 10, 18, 0.88); backdrop-filter: blur(20px); border: 1px solid rgba(100, 160, 255, 0.12); border-radius: 12px; padding: 16px; color: #c0d0e8; font-size: 10px; z-index: 10; scrollbar-width: thin; scrollbar-color: rgba(100,160,255,0.2) transparent; transition: transform 0.3s ease, opacity 0.3s ease; }
  #controls.collapsed { transform: translateX(calc(100% + 12px)); opacity: 0; pointer-events: none; }
  #controls::-webkit-scrollbar { width: 4px; }
  #controls::-webkit-scrollbar-thumb { background: rgba(100,160,255,0.2); border-radius: 2px; }
  #controls h1 { font-size: 13px; font-weight: 500; color: #e0ecff; margin-bottom: 3px; letter-spacing: 0.5px; }
  #controls .subtitle { font-size: 9px; color: #5a7a9a; margin-bottom: 12px; letter-spacing: 0.3px; }
  
  .control-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .control-row label { flex-shrink: 0; color: #8aa0b8; font-size: 10px; }
  .control-row .right { display: flex; align-items: center; gap: 6px; }
  .control-row input[type="range"] { width: 140px; height: 3px; -webkit-appearance: none; appearance: none; background: rgba(100, 160, 255, 0.15); border-radius: 2px; outline: none; }
  .control-row input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 10px; height: 10px; border-radius: 50%; background: #4a90d9; cursor: pointer; border: 2px solid #0a0c10; }
  .control-row .val { width: 40px; text-align: right; font-size: 9px; color: #4a90d9; font-variant-numeric: tabular-nums; }
  
  .btn { padding: 8px 16px; font-size: 10px; font-family: inherit; background: rgba(100, 160, 255, 0.12); color: #8ab0d8; border: 1px solid rgba(100, 160, 255, 0.2); border-radius: 6px; cursor: pointer; transition: all 0.2s; }
  .btn:hover { background: rgba(100, 160, 255, 0.25); color: #e0f0ff; border-color: #4a90d9; }
  .btn-group { display: flex; gap: 6px; margin-bottom: 12px; }
  
  .toggle-switch { position: relative; width: 36px; height: 18px; cursor: pointer; display: inline-block; }
  .toggle-switch input { display: none; }
  .toggle-switch .slider { position: absolute; inset: 0; background: rgba(100, 160, 255, 0.12); border-radius: 9px; transition: background 0.2s; }
  .toggle-switch .slider::after { content: ''; position: absolute; width: 14px; height: 14px; left: 2px; top: 2px; background: #5a7a9a; border-radius: 50%; transition: all 0.2s; }
  .toggle-switch input:checked + .slider { background: rgba(74, 144, 217, 0.4); }
  .toggle-switch input:checked + .slider::after { left: 20px; background: #4a90d9; }
  
  #panel-toggle { position: fixed; top: 12px; right: 12px; z-index: 11; width: 36px; height: 36px; background: rgba(8, 10, 18, 0.88); backdrop-filter: blur(20px); border: 1px solid rgba(100, 160, 255, 0.12); border-radius: 8px; color: #8ab0d8; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
  #panel-toggle:hover { background: rgba(100, 160, 255, 0.12); color: #e0f0ff; }
  
  #info { position: fixed; bottom: 12px; left: 12px; color: rgba(100,160,200,0.4); font-size: 9px; pointer-events: none; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<button id="panel-toggle" onclick="togglePanel()" title="Toggle Controls">⚙</button>

<div id="fps">
  <div><span class="fps-value" id="fps-value">--</span> FPS</div>
</div>

<div id="controls">
  <h1>Experiment 1: Wind-Forced Waves</h1>
  <div class="subtitle">Wind forcing term added to wave equation</div>
  
  <div class="btn-group">
    <button class="btn" onclick="clearWaves()">Clear</button>
    <button class="btn" onclick="addRandomSource()">Random Drop</button>
  </div>
  
  <div class="control-row">
    <label>Debug Colormap</label>
    <div class="right">
      <label class="toggle-switch"><input type="checkbox" id="debugMode" onchange="updateDebugMode()"><span class="slider"></span></label>
    </div>
  </div>
  
  <div class="control-row">
    <label>Wave Speed</label>
    <div class="right">
      <input type="range" id="waveSpeed" min="0.5" max="3" step="0.1" value="1.5" oninput="updateWaveSpeed(this.value)">
      <span class="val" id="waveSpeed_v">1.5</span>
    </div>
  </div>
  
  <div class="control-row">
    <label>Damping</label>
    <div class="right">
      <input type="range" id="damping" min="0.90" max="1.0" step="0.005" value="0.995" oninput="updateDamping(this.value)">
      <span class="val" id="damping_v">0.995</span>
    </div>
  </div>
  
  <div class="control-row">
    <label>Wave Scale</label>
    <div class="right">
      <input type="range" id="waveScale" min="0.5" max="10" step="0.5" value="5.0" oninput="updateWaveScale(this.value)">
      <span class="val" id="waveScale_v">5.0</span>
    </div>
  </div>
  
  <div class="control-row">
    <label>Source Strength</label>
    <div class="right">
      <input type="range" id="sourceStrength" min="0.1" max="2" step="0.1" value="1.0" oninput="updateSourceStrength(this.value)">
      <span class="val" id="sourceStrength_v">1.0</span>
    </div>
  </div>
  
  <div style="margin-top: 12px; padding-top: 12px; border-top: 1px solid rgba(100,160,255,0.1);"></div>
  
  <div class="control-row">
    <label>Wind Angle</label>
    <div class="right">
      <input type="range" id="windAngle" min="0" max="360" step="5" value="90" oninput="updateWindAngle(this.value)">
      <span class="val" id="windAngle_v">90°</span>
    </div>
  </div>
  
  <div class="control-row">
    <label>Wind Strength</label>
    <div class="right">
      <input type="range" id="windStrength" min="0" max="5" step="0.1" value="0" oninput="updateWindStrength(this.value)">
      <span class="val" id="windStrength_v">0.0</span>
    </div>
  </div>
  
  <div style="margin-top: 16px; padding-top: 12px; border-top: 1px solid rgba(100,160,255,0.1); font-size: 9px; color: #5a7a9a; line-height: 1.4;">
    <strong style="color: #8ab0d8;">Wind</strong> creates directional wave bias<br>
    <strong style="color: #8ab0d8;">Click/Tap</strong> to add wave source<br>
    <strong style="color: #8ab0d8;">Drag</strong> to rotate · <strong style="color: #8ab0d8;">Pinch</strong> to zoom
  </div>
</div>

<div id="info">Experiment 1: Wind Forcing · adjust wind angle + strength · tap to add disturbances</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// === SIMULATION PARAMETERS ===
const SIM_SIZE = 1024; // Texture resolution
const MESH_SIZE = 256; // Ocean mesh resolution
let waveSpeed = 1.5;
let damping = 0.995;
let waveScale = 5.0; // Increased from 2.0 for MUCH more visible waves
let sourceStrength = 1.0;
let windAngle = 90;
let windStrength = 0;
let debugMode = false;

// === THREE.JS SETUP ===
const canvas = document.getElementById('canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, alpha: false });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0c10);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 500);
camera.position.set(0, 30, 40);
camera.lookAt(0, 0, 0);

// === PING-PONG RENDER TARGETS ===
const rtOptions = {
  minFilter: THREE.LinearFilter,
  magFilter: THREE.LinearFilter,
  format: THREE.RGBAFormat,
  type: THREE.FloatType
};

let rtA = new THREE.WebGLRenderTarget(SIM_SIZE, SIM_SIZE, rtOptions);
let rtB = new THREE.WebGLRenderTarget(SIM_SIZE, SIM_SIZE, rtOptions);

// === WAVE EQUATION SHADER ===
const waveShader = {
  uniforms: {
    uHeightCurrent: { value: null },
    uHeightPrevious: { value: null },
    uTexelSize: { value: new THREE.Vector2(1.0 / SIM_SIZE, 1.0 / SIM_SIZE) },
    uWaveSpeed: { value: waveSpeed },
    uDamping: { value: damping },
    uDeltaTime: { value: 0.016 },
    uWindAngle: { value: windAngle * Math.PI / 180 },
    uWindStrength: { value: windStrength },
    uTime: { value: 0 }
  },
  vertexShader: `
    varying vec2 vUv;
    void main() {
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    precision highp float;
    uniform sampler2D uHeightCurrent;
    uniform sampler2D uHeightPrevious;
    uniform vec2 uTexelSize;
    uniform float uWaveSpeed;
    uniform float uDamping;
    uniform float uDeltaTime;
    uniform float uWindAngle;
    uniform float uWindStrength;
    uniform float uTime;
    varying vec2 vUv;
    
    void main() {
      // Sample current and previous heights
      float h = texture2D(uHeightCurrent, vUv).r;
      float h_old = texture2D(uHeightPrevious, vUv).r;
      
      // Sample neighbors (for Laplacian)
      float h_right = texture2D(uHeightCurrent, vUv + vec2(uTexelSize.x, 0.0)).r;
      float h_left  = texture2D(uHeightCurrent, vUv - vec2(uTexelSize.x, 0.0)).r;
      float h_up    = texture2D(uHeightCurrent, vUv + vec2(0.0, uTexelSize.y)).r;
      float h_down  = texture2D(uHeightCurrent, vUv - vec2(0.0, uTexelSize.y)).r;
      
      // Laplacian (discrete curvature)
      float laplacian = (h_right + h_left + h_up + h_down - 4.0 * h);
      
      // Wave equation (Verlet integration)
      float c2_dt2 = uWaveSpeed * uWaveSpeed * uDeltaTime * uDeltaTime;
      float h_new = 2.0 * h - h_old + c2_dt2 * laplacian;
      
      // Wind forcing term
      if (uWindStrength > 0.0) {
        vec2 windDir = normalize(vec2(cos(uWindAngle), sin(uWindAngle)));
        vec2 gradient = vec2(h_right - h_left, h_up - h_down) / (2.0 * uTexelSize.x);
        
        // Wind adds energy along wind direction
        float windForce = uWindStrength * dot(windDir, gradient) * 0.15;
        h_new += windForce * uDeltaTime;
        
        // Also add continuous seed forcing (creates waves from flat)
        float distToCenter = length(vUv - 0.5);
        if (distToCenter < 0.4) {
          // Much stronger seed forcing to create visible ripples
          h_new += uWindStrength * 0.001 * sin(vUv.x * 30.0 + vUv.y * 30.0 + uTime * 2.0);
        }
      }
      
      // Apply damping (energy dissipation)
      h_new *= uDamping;
      
      // Absorbing boundaries
      float edgeX = min(vUv.x, 1.0 - vUv.x);
      float edgeY = min(vUv.y, 1.0 - vUv.y);
      float edgeDist = min(edgeX, edgeY);
      float boundaryDamp = smoothstep(0.0, 0.05, edgeDist);
      h_new *= boundaryDamp;
      
      gl_FragColor = vec4(h_new, 0.0, 0.0, 1.0);
    }
  `
};

const waveMaterial = new THREE.ShaderMaterial(waveShader);
const quadGeo = new THREE.PlaneGeometry(2, 2);
const quadMesh = new THREE.Mesh(quadGeo, waveMaterial);
const simScene = new THREE.Scene();
simScene.add(quadMesh);
const simCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

// Initialize to zero
clearWaves();

// === OCEAN MESH ===
const oceanGeo = new THREE.PlaneGeometry(100, 100, MESH_SIZE - 1, MESH_SIZE - 1);
oceanGeo.rotateX(-Math.PI / 2);

const oceanShader = {
  uniforms: {
    uHeightfield: { value: rtA.texture },
    uWaveScale: { value: waveScale },
    uSunDirection: { value: new THREE.Vector3(-0.5, -0.6, -0.7).normalize() },
    uSunColor: { value: new THREE.Color(0xffe8c0) },
    uDebugMode: { value: false }
  },
  vertexShader: `
    uniform sampler2D uHeightfield;
    uniform float uWaveScale;
    varying vec3 vWorldPos;
    varying float vHeight;
    varying vec2 vUv;
    
    void main() {
      vUv = (position.xz + 50.0) / 100.0;
      float height = texture2D(uHeightfield, vUv).r * uWaveScale;
      
      vec3 pos = position;
      pos.y = height;
      vHeight = height;
      
      vec4 worldPos = modelMatrix * vec4(pos, 1.0);
      vWorldPos = worldPos.xyz;
      
      gl_Position = projectionMatrix * viewMatrix * worldPos;
    }
  `,
  fragmentShader: `
    precision highp float;
    uniform sampler2D uHeightfield;
    uniform float uWaveScale;
    uniform vec3 uSunDirection;
    uniform vec3 uSunColor;
    uniform bool uDebugMode;
    varying vec3 vWorldPos;
    varying float vHeight;
    varying vec2 vUv;
    
    vec3 calculateNormal() {
      float texelSize = 1.0 / ${SIM_SIZE.toFixed(1)};
      
      float h_right = texture2D(uHeightfield, vUv + vec2(texelSize, 0.0)).r * uWaveScale;
      float h_left  = texture2D(uHeightfield, vUv - vec2(texelSize, 0.0)).r * uWaveScale;
      float h_up    = texture2D(uHeightfield, vUv + vec2(0.0, texelSize)).r * uWaveScale;
      float h_down  = texture2D(uHeightfield, vUv - vec2(0.0, texelSize)).r * uWaveScale;
      
      vec3 dx = vec3(2.0 * texelSize * 100.0, h_right - h_left, 0.0);
      vec3 dz = vec3(0.0, h_up - h_down, 2.0 * texelSize * 100.0);
      
      return normalize(cross(dz, dx));
    }
    
    void main() {
      if (uDebugMode) {
        // Debug colormap
        float h = vHeight / uWaveScale;
        vec3 color;
        if (h > 0.0) {
          color = mix(vec3(0.0, 0.5, 1.0), vec3(1.0, 1.0, 1.0), clamp(h * 5.0, 0.0, 1.0));
        } else {
          color = mix(vec3(0.0, 0.0, 0.5), vec3(0.0, 0.5, 1.0), clamp(1.0 + h * 5.0, 0.0, 1.0));
        }
        gl_FragColor = vec4(color, 1.0);
      } else {
        // Enhanced realistic water rendering
        vec3 normal = calculateNormal();
        vec3 lightDir = normalize(-uSunDirection);
        vec3 viewDir = normalize(cameraPosition - vWorldPos);
        vec3 halfDir = normalize(lightDir + viewDir);
        
        float NdotL = max(0.0, dot(normal, lightDir));
        float NdotV = max(0.0, dot(normal, viewDir));
        
        // Deep water color (darker blue-green)
        vec3 deepColor = vec3(0.0, 0.15, 0.3);
        vec3 shallowColor = vec3(0.0, 0.4, 0.6);
        
        // Height-based color (wave tips lighter)
        float heightFactor = vHeight / uWaveScale;
        vec3 baseColor = mix(deepColor, shallowColor, smoothstep(-0.3, 0.3, heightFactor));
        
        // Diffuse
        vec3 diffuse = uSunColor * NdotL * baseColor * 0.6;
        
        // Strong specular highlights
        float spec = pow(max(0.0, dot(normal, halfDir)), 80.0) * NdotL;
        vec3 specular = uSunColor * spec * 1.5;
        
        // Fresnel effect (edges more reflective)
        float fresnel = pow(1.0 - NdotV, 3.0);
        vec3 skyColor = vec3(0.4, 0.6, 0.8);
        vec3 reflection = skyColor * fresnel * 0.8;
        
        // Wave tip highlights (foam-like)
        float foamFactor = smoothstep(0.2, 0.5, heightFactor);
        vec3 foam = vec3(0.9, 0.95, 1.0) * foamFactor * 0.4;
        
        // Ambient
        vec3 ambient = vec3(0.02, 0.04, 0.08);
        
        // Combine
        vec3 color = ambient + diffuse + specular + reflection + foam;
        
        // Tone map
        color = color / (color + 1.0);
        color = pow(color, vec3(1.0 / 2.2));
        
        gl_FragColor = vec4(color, 1.0);
      }
    }
  `
};

const oceanMaterial = new THREE.ShaderMaterial(oceanShader);
const ocean = new THREE.Mesh(oceanGeo, oceanMaterial);
scene.add(ocean);

// === ORBIT CONTROLS ===
const orbit = { th: Math.PI * 0.75, ph: Math.PI * 0.3, r: 50, tgt: new THREE.Vector3(0, 0, 0), drag: false, lx: 0, ly: 0 };
function updateCamera() {
  camera.position.set(
    orbit.tgt.x + orbit.r * Math.sin(orbit.ph) * Math.cos(orbit.th),
    orbit.tgt.y + orbit.r * Math.cos(orbit.ph),
    orbit.tgt.z + orbit.r * Math.sin(orbit.ph) * Math.sin(orbit.th)
  );
  camera.lookAt(orbit.tgt);
}
updateCamera();

canvas.addEventListener('mousedown', e => {
  if (e.button === 0) {
    const rect = canvas.getBoundingClientRect();
    const x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
    const y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
    
    // Raycast to ocean plane
    const raycaster = new THREE.Raycaster();
    raycaster.setFromCamera(new THREE.Vector2(x, y), camera);
    const intersects = raycaster.intersectObject(ocean);
    
    if (intersects.length > 0) {
      const point = intersects[0].point;
      addWaveSource(point.x, point.z);
    } else {
      orbit.drag = true;
      orbit.lx = e.clientX;
      orbit.ly = e.clientY;
    }
  }
});

window.addEventListener('mouseup', () => { orbit.drag = false; });
window.addEventListener('mousemove', e => {
  if (orbit.drag) {
    const dx = e.clientX - orbit.lx, dy = e.clientY - orbit.ly;
    orbit.lx = e.clientX; orbit.ly = e.clientY;
    orbit.th -= dx * 0.005;
    orbit.ph = Math.max(0.1, Math.min(Math.PI * 0.49, orbit.ph - dy * 0.005));
    updateCamera();
  }
});

canvas.addEventListener('wheel', e => {
  orbit.r = Math.max(10, Math.min(150, orbit.r * (1 + e.deltaY * 0.001)));
  updateCamera();
  e.preventDefault();
}, { passive: false });

// === TOUCH CONTROLS ===
let touchDist = 0;
let touchStartTime = 0;
let touchMoved = false;

canvas.addEventListener('touchstart', e => {
  touchStartTime = Date.now();
  touchMoved = false;
  
  if (e.touches.length === 1) {
    orbit.drag = true;
    orbit.lx = e.touches[0].clientX;
    orbit.ly = e.touches[0].clientY;
  } else if (e.touches.length === 2) {
    orbit.drag = false;
    touchDist = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY
    );
  }
});

canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  touchMoved = true;
  
  if (e.touches.length === 1 && orbit.drag) {
    const dx = e.touches[0].clientX - orbit.lx;
    const dy = e.touches[0].clientY - orbit.ly;
    orbit.lx = e.touches[0].clientX;
    orbit.ly = e.touches[0].clientY;
    orbit.th -= dx * 0.005;
    orbit.ph = Math.max(0.1, Math.min(Math.PI * 0.49, orbit.ph - dy * 0.005));
    updateCamera();
  } else if (e.touches.length === 2) {
    const newDist = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY
    );
    orbit.r = Math.max(10, Math.min(150, orbit.r * (touchDist / newDist)));
    touchDist = newDist;
    updateCamera();
  }
}, { passive: false });

canvas.addEventListener('touchend', e => {
  orbit.drag = false;
  
  // Quick tap (< 200ms, no movement) = add wave source
  if (e.changedTouches.length === 1 && !touchMoved && (Date.now() - touchStartTime) < 200) {
    const touch = e.changedTouches[0];
    const rect = canvas.getBoundingClientRect();
    const x = ((touch.clientX - rect.left) / rect.width) * 2 - 1;
    const y = -((touch.clientY - rect.top) / rect.height) * 2 + 1;
    
    const raycaster = new THREE.Raycaster();
    raycaster.setFromCamera(new THREE.Vector2(x, y), camera);
    const intersects = raycaster.intersectObject(ocean);
    
    if (intersects.length > 0) {
      const point = intersects[0].point;
      addWaveSource(point.x, point.z);
    }
  }
});

// === WAVE SOURCE ===
const sourceShader = {
  uniforms: {
    uHeightfield: { value: null },
    uSourcePos: { value: new THREE.Vector2(0.5, 0.5) },
    uSourceStrength: { value: sourceStrength }
  },
  vertexShader: `
    varying vec2 vUv;
    void main() {
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    precision highp float;
    uniform sampler2D uHeightfield;
    uniform vec2 uSourcePos;
    uniform float uSourceStrength;
    varying vec2 vUv;
    
    void main() {
      float h = texture2D(uHeightfield, vUv).r;
      
      float dist = distance(vUv, uSourcePos);
      float radius = 0.03; // Increased from 0.02 for larger splash
      float influence = exp(-dist * dist / (radius * radius));
      
      h += uSourceStrength * influence * 0.5; // Boost splash strength
      
      gl_FragColor = vec4(h, 0.0, 0.0, 1.0);
    }
  `
};

const sourceMaterial = new THREE.ShaderMaterial(sourceShader);
const sourceQuad = new THREE.Mesh(quadGeo, sourceMaterial);
const sourceScene = new THREE.Scene();
sourceScene.add(sourceQuad);

function addWaveSource(x, z) {
  const u = (x + 50) / 100;
  const v = (z + 50) / 100;
  
  sourceShader.uniforms.uHeightfield.value = rtA.texture;
  sourceShader.uniforms.uSourcePos.value.set(u, v);
  sourceShader.uniforms.uSourceStrength.value = sourceStrength;
  
  renderer.setRenderTarget(rtB);
  renderer.render(sourceScene, simCamera);
  
  // Swap
  const temp = rtA;
  rtA = rtB;
  rtB = temp;
  
  oceanMaterial.uniforms.uHeightfield.value = rtA.texture;
}

function clearWaves() {
  renderer.setRenderTarget(rtA);
  renderer.clear();
  renderer.setRenderTarget(rtB);
  renderer.clear();
  renderer.setRenderTarget(null);
}

function addRandomSource() {
  const x = Math.random() * 100 - 50;
  const z = Math.random() * 100 - 50;
  addWaveSource(x, z);
}

// === UPDATE FUNCTIONS ===
function updateWaveSpeed(v) {
  waveSpeed = parseFloat(v);
  waveShader.uniforms.uWaveSpeed.value = waveSpeed;
  document.getElementById('waveSpeed_v').textContent = v;
}

function updateDamping(v) {
  damping = parseFloat(v);
  waveShader.uniforms.uDamping.value = damping;
  document.getElementById('damping_v').textContent = v;
}

function updateWaveScale(v) {
  waveScale = parseFloat(v);
  oceanMaterial.uniforms.uWaveScale.value = waveScale;
  document.getElementById('waveScale_v').textContent = v;
}

function updateSourceStrength(v) {
  sourceStrength = parseFloat(v);
  document.getElementById('sourceStrength_v').textContent = v;
}

function updateWindAngle(v) {
  windAngle = parseFloat(v);
  waveShader.uniforms.uWindAngle.value = windAngle * Math.PI / 180;
  document.getElementById('windAngle_v').textContent = v + '°';
}

function updateWindStrength(v) {
  windStrength = parseFloat(v);
  waveShader.uniforms.uWindStrength.value = windStrength;
  document.getElementById('windStrength_v').textContent = v;
}

function updateDebugMode() {
  debugMode = document.getElementById('debugMode').checked;
  oceanMaterial.uniforms.uDebugMode.value = debugMode;
}

function togglePanel() {
  document.getElementById('controls').classList.toggle('collapsed');
  const btn = document.getElementById('panel-toggle');
  btn.textContent = document.getElementById('controls').classList.contains('collapsed') ? '☰' : '⚙';
}

// === FPS COUNTER ===
let frameCount = 0, lastTime = performance.now(), fps = 0;
function updateFPS() {
  frameCount++;
  const now = performance.now();
  if (now >= lastTime + 1000) {
    fps = Math.round((frameCount * 1000) / (now - lastTime));
    document.getElementById('fps-value').textContent = fps;
    frameCount = 0;
    lastTime = now;
  }
}

// === RENDER LOOP ===
const clock = new THREE.Clock();
let initialized = false;

function animate() {
  requestAnimationFrame(animate);
  
  // Add initial disturbance on first frame
  if (!initialized) {
    initialized = true;
    // Add 3 random disturbances to see something immediately
    setTimeout(() => {
      addWaveSource(0, 0);
      addWaveSource(-10, 10);
      addWaveSource(10, -10);
    }, 100);
  }
  
  const dt = Math.min(clock.getDelta(), 0.033); // Cap at 30 FPS for stability
  waveShader.uniforms.uDeltaTime.value = dt;
  waveShader.uniforms.uTime.value = clock.getElapsedTime();
  
  // Simulate wave propagation (ping-pong)
  waveShader.uniforms.uHeightCurrent.value = rtA.texture;
  waveShader.uniforms.uHeightPrevious.value = rtB.texture;
  
  renderer.setRenderTarget(rtA);
  renderer.render(simScene, simCamera);
  
  // Swap render targets
  const temp = rtA;
  rtA = rtB;
  rtB = temp;
  
  // Update ocean mesh with latest heightfield
  oceanMaterial.uniforms.uHeightfield.value = rtA.texture;
  
  // Render scene
  renderer.setRenderTarget(null);
  renderer.render(scene, camera);
  
  updateFPS();
}

animate();

// === WINDOW RESIZE ===
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
