<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Experiment 2: CPU-Based Wave Propagation</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; font-family: 'Segoe UI', sans-serif; background: #000; color: #fff; touch-action: none; }
canvas { display: block; width: 100vw; height: 100vh; }
#ui { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.8); padding: 15px; border-radius: 8px; max-width: 300px; font-size: 13px; }
#info { position: absolute; bottom: 10px; left: 10px; background: rgba(0,0,0,0.7); padding: 10px; border-radius: 5px; font-size: 12px; }
.control-row { display: flex; justify-content: space-between; align-items: center; margin: 8px 0; }
.control-row label { flex: 1; }
.control-row .right { flex: 1; text-align: right; }
input[type="range"] { width: 120px; }
.val { display: inline-block; min-width: 40px; text-align: right; margin-left: 8px; }
button { background: #2a5; color: #fff; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; margin: 4px 0; width: 100%; }
button:active { background: #1a4; }
.toggle-switch { position: relative; display: inline-block; width: 48px; height: 24px; }
.toggle-switch input { opacity: 0; width: 0; height: 0; }
.slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background: #555; transition: .3s; border-radius: 24px; }
.slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background: white; transition: .3s; border-radius: 50%; }
input:checked + .slider { background: #2a5; }
input:checked + .slider:before { transform: translateX(24px); }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="ui">
  <h3 style="margin-bottom:10px">Experiment 2: Wave Propagation</h3>
  
  <div class="control-row">
    <label>Wind Angle</label>
    <div class="right">
      <input type="range" id="windAngle" min="0" max="360" step="5" value="90">
      <span class="val" id="windAngle_v">90°</span>
    </div>
  </div>
  
  <div class="control-row">
    <label>Wind Strength</label>
    <div class="right">
      <input type="range" id="windStrength" min="0" max="5" step="0.5" value="2">
      <span class="val" id="windStrength_v">2.0</span>
    </div>
  </div>
  
  <div class="control-row">
    <label>Wave Scale</label>
    <div class="right">
      <input type="range" id="waveScale" min="0.1" max="10" step="0.1" value="5">
      <span class="val" id="waveScale_v">5.0</span>
    </div>
  </div>
  
  <div class="control-row">
    <label>Debug Colormap</label>
    <div class="right">
      <label class="toggle-switch">
        <input type="checkbox" id="debugMode">
        <span class="slider"></span>
      </label>
    </div>
  </div>
  
  <button id="randomDrop">Random Drop</button>
  <button id="clearWaves">Clear Waves</button>
  
  <div style="margin-top:10px; font-size:11px; opacity:0.7;">
    Tap water to add waves
  </div>
</div>

<div id="info">Wave Propagation · <span id="fps">0</span> FPS</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// === SETTINGS ===
const SIM_SIZE = 256; // CPU simulation grid
const MESH_SIZE = 128; // Visual mesh (lower for performance)

let waveSpeed = 1.5;
let damping = 0.995;
let waveScale = 5.0;
let windAngle = 90 * Math.PI / 180;
let windStrength = 2.0;
let debugMode = false;

// Island obstacle
const ISLAND_CENTER_X = 0.5; // Normalized [0,1]
const ISLAND_CENTER_Y = 0.5;
const ISLAND_RADIUS = 0.15; // Normalized

// Random ripple sources
let rippleSources = [];
let lastRippleTime = 0;

// === CPU SIMULATION BUFFERS ===
const size = SIM_SIZE;
let h0 = new Float32Array(size * size); // Previous height
let h1 = new Float32Array(size * size); // Current height
let h2 = new Float32Array(size * size); // Next height

// Initialize all to zero
h0.fill(0);
h1.fill(0);
h2.fill(0);

// Add 3 initial waves
function addInitialWaves() {
  addWaveAt(0.3, 0.3, 0.5);
  setTimeout(() => addWaveAt(0.6, 0.5, 0.5), 300);
  setTimeout(() => addWaveAt(0.5, 0.7, 0.5), 600);
}

function addWaveAt(x, y, strength) {
  const cx = Math.floor(x * size);
  const cy = Math.floor(y * size);
  const radius = Math.floor(size * 0.03);
  
  for (let dy = -radius; dy <= radius; dy++) {
    for (let dx = -radius; dx <= radius; dx++) {
      const px = cx + dx;
      const py = cy + dy;
      if (px >= 0 && px < size && py >= 0 && py < size) {
        const dist = Math.sqrt(dx*dx + dy*dy);
        if (dist <= radius) {
          const influence = Math.exp(-dist * dist / (radius * radius));
          const idx = py * size + px;
          h1[idx] += strength * influence;
        }
      }
    }
  }
}

// === WAVE EQUATION SIMULATION (CPU) ===
function stepSimulation(dt) {
  const c2 = waveSpeed * waveSpeed;
  const dt2 = dt * dt;
  const dx = 1.0;
  
  // Wind direction
  const windDx = Math.cos(windAngle);
  const windDy = Math.sin(windAngle);
  
  // Island center in grid coordinates
  const islandCX = ISLAND_CENTER_X * size;
  const islandCY = ISLAND_CENTER_Y * size;
  const islandR = ISLAND_RADIUS * size;
  
  for (let y = 1; y < size - 1; y++) {
    for (let x = 1; x < size - 1; x++) {
      const idx = y * size + x;
      
      // Check if inside island (solid obstacle)
      const distToIsland = Math.sqrt((x - islandCX)**2 + (y - islandCY)**2);
      if (distToIsland < islandR) {
        // Inside island - freeze height at zero
        h2[idx] = 0;
        h1[idx] = 0;
        h0[idx] = 0;
        continue;
      }
      
      // Current and previous
      const h_curr = h1[idx];
      const h_prev = h0[idx];
      
      // Neighbors (Laplacian) - check if neighbors are inside island
      let h_right = h1[idx + 1];
      let h_left = h1[idx - 1];
      let h_up = h1[idx + size];
      let h_down = h1[idx - size];
      
      // Reflecting boundary: if neighbor is inside island, reflect current height
      const distRight = Math.sqrt((x + 1 - islandCX)**2 + (y - islandCY)**2);
      const distLeft = Math.sqrt((x - 1 - islandCX)**2 + (y - islandCY)**2);
      const distUp = Math.sqrt((x - islandCX)**2 + (y + 1 - islandCY)**2);
      const distDown = Math.sqrt((x - islandCX)**2 + (y - 1 - islandCY)**2);
      
      if (distRight < islandR) h_right = -h_curr; // Reflect
      if (distLeft < islandR) h_left = -h_curr;
      if (distUp < islandR) h_up = -h_curr;
      if (distDown < islandR) h_down = -h_curr;
      
      const laplacian = (h_right + h_left + h_up + h_down - 4 * h_curr) / (dx * dx);
      
      // Wave equation
      let h_next = 2 * h_curr - h_prev + c2 * dt2 * laplacian;
      
      // Wind forcing
      const gradX = (h_right - h_left) / (2 * dx);
      const gradY = (h_up - h_down) / (2 * dx);
      const windForce = windStrength * (windDx * gradX + windDy * gradY) * 0.15;
      h_next += windForce * dt;
      
      // Enhanced random seed forcing (multiple noise octaves)
      const t = Date.now() * 0.001;
      const noise1 = Math.sin(x * 0.3 + y * 0.3 + t * 2.0);
      const noise2 = Math.sin(x * 0.7 - y * 0.5 + t * 3.0) * 0.5;
      const noise3 = Math.sin(x * 1.2 + y * 0.9 + t * 1.5) * 0.25;
      const combinedNoise = (noise1 + noise2 + noise3) / 1.75;
      h_next += windStrength * 0.002 * combinedNoise;
      
      // Damping
      h_next *= damping;
      
      // Absorbing boundaries (edges)
      const edgeX = Math.min(x, size - 1 - x) / size;
      const edgeY = Math.min(y, size - 1 - y) / size;
      const edgeDist = Math.min(edgeX, edgeY);
      const boundaryDamp = Math.min(1, edgeDist / 0.05);
      h_next *= boundaryDamp;
      
      h2[idx] = h_next;
    }
  }
  
  // Swap buffers
  const temp = h0;
  h0 = h1;
  h1 = h2;
  h2 = temp;
}

// === THREE.JS SETUP ===
const canvas = document.getElementById('canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87CEEB); // Sky blue background

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 500);
camera.position.set(0, 30, 40);
camera.lookAt(0, 0, 0);

// === OCEAN MESH ===
const oceanGeo = new THREE.PlaneGeometry(100, 100, MESH_SIZE - 1, MESH_SIZE - 1);
oceanGeo.rotateX(-Math.PI / 2);

// Create texture from CPU data (using UnsignedByteType for compatibility)
const texData = new Uint8Array(size * size * 4);
const heightTexture = new THREE.DataTexture(texData, size, size, THREE.RGBAFormat, THREE.UnsignedByteType);
heightTexture.minFilter = THREE.LinearFilter;
heightTexture.magFilter = THREE.LinearFilter;

const oceanShader = {
  uniforms: {
    uHeightfield: { value: heightTexture },
    uWaveScale: { value: waveScale },
    uSunDirection: { value: new THREE.Vector3(-0.5, -0.6, -0.7).normalize() },
    uSunColor: { value: new THREE.Color(0xffe8c0) },
    uDebugMode: { value: false }
  },
  vertexShader: `
    uniform sampler2D uHeightfield;
    uniform float uWaveScale;
    varying vec3 vWorldPos;
    varying float vHeight;
    varying vec2 vUv;
    
    void main() {
      vUv = (position.xz + 50.0) / 100.0;
      // Decode byte texture back to float
      float byteVal = texture2D(uHeightfield, vUv).r; // 0-1 range
      float decoded = byteVal * 20.0 - 10.0; // Map back to [-10,10]
      float height = decoded * uWaveScale;
      
      vec3 pos = position;
      pos.y = height;
      vHeight = height;
      
      vec4 worldPos = modelMatrix * vec4(pos, 1.0);
      vWorldPos = worldPos.xyz;
      
      gl_Position = projectionMatrix * viewMatrix * worldPos;
    }
  `,
  fragmentShader: `
    precision highp float;
    uniform sampler2D uHeightfield;
    uniform float uWaveScale;
    uniform vec3 uSunDirection;
    uniform vec3 uSunColor;
    uniform bool uDebugMode;
    varying vec3 vWorldPos;
    varying float vHeight;
    varying vec2 vUv;
    
    #define PI 3.14159265359
    
    // Smooth normal with 3x3 sampling
    vec3 calculateNormal() {
      float texelSize = 1.0 / 256.0;
      float scale = 100.0 * texelSize;
      
      // 3x3 Sobel-like sampling for smoother normals
      float h00 = (texture2D(uHeightfield, vUv + vec2(-texelSize, -texelSize)).r * 20.0 - 10.0) * uWaveScale;
      float h10 = (texture2D(uHeightfield, vUv + vec2(0.0, -texelSize)).r * 20.0 - 10.0) * uWaveScale;
      float h20 = (texture2D(uHeightfield, vUv + vec2(texelSize, -texelSize)).r * 20.0 - 10.0) * uWaveScale;
      
      float h01 = (texture2D(uHeightfield, vUv + vec2(-texelSize, 0.0)).r * 20.0 - 10.0) * uWaveScale;
      float h21 = (texture2D(uHeightfield, vUv + vec2(texelSize, 0.0)).r * 20.0 - 10.0) * uWaveScale;
      
      float h02 = (texture2D(uHeightfield, vUv + vec2(-texelSize, texelSize)).r * 20.0 - 10.0) * uWaveScale;
      float h12 = (texture2D(uHeightfield, vUv + vec2(0.0, texelSize)).r * 20.0 - 10.0) * uWaveScale;
      float h22 = (texture2D(uHeightfield, vUv + vec2(texelSize, texelSize)).r * 20.0 - 10.0) * uWaveScale;
      
      // Sobel operator
      float dx = (h20 + 2.0*h21 + h22) - (h00 + 2.0*h01 + h02);
      float dz = (h02 + 2.0*h12 + h22) - (h00 + 2.0*h10 + h20);
      
      vec3 tangentX = vec3(2.0 * scale, dx, 0.0);
      vec3 tangentZ = vec3(0.0, dz, 2.0 * scale);
      
      return normalize(cross(tangentZ, tangentX));
    }
    
    // Improved sky color with gradient
    vec3 skyColor(vec3 dir) {
      float elevation = max(0.0, dir.y);
      vec3 horizonColor = vec3(0.6, 0.75, 0.9);   // Light blue-gray
      vec3 zenithColor = vec3(0.2, 0.4, 0.7);     // Deeper blue
      return mix(horizonColor, zenithColor, pow(elevation, 0.5));
    }
    
    // Sun disk
    float sunDisk(vec3 dir, vec3 sunDir) {
      float sunDot = max(0.0, dot(dir, -sunDir));
      return pow(sunDot, 256.0) * 2.0; // Sharp sun
    }
    
    // Schlick fresnel
    vec3 fresnelSchlick(float cosTheta, vec3 F0) {
      return F0 + (1.0 - F0) * pow(1.0 - cosTheta, 5.0);
    }
    
    void main() {
      if (uDebugMode) {
        float h = vHeight / uWaveScale;
        vec3 color;
        if (h > 0.0) {
          color = mix(vec3(0.0, 0.5, 1.0), vec3(1.0, 1.0, 1.0), clamp(h * 5.0, 0.0, 1.0));
        } else {
          color = mix(vec3(0.0, 0.1, 0.3), vec3(0.0, 0.5, 1.0), clamp(-h * 5.0, 0.0, 1.0));
        }
        gl_FragColor = vec4(color, 1.0);
      } else {
        // Ultra-realistic water rendering
        vec3 normal = calculateNormal();
        vec3 lightDir = normalize(-uSunDirection);
        vec3 viewDir = normalize(cameraPosition - vWorldPos);
        vec3 halfDir = normalize(lightDir + viewDir);
        vec3 reflectDir = reflect(-viewDir, normal);
        
        float NdotL = max(0.0, dot(normal, lightDir));
        float NdotV = max(0.0, dot(normal, viewDir));
        float NdotH = max(0.0, dot(normal, halfDir));
        float VdotH = max(0.0, dot(viewDir, halfDir));
        
        // Enhanced water colors (realistic ocean)
        vec3 deepOceanColor = vec3(0.0, 0.05, 0.15);      // Very deep blue
        vec3 shallowWaterColor = vec3(0.0, 0.3, 0.5);     // Cyan-blue
        vec3 foamyColor = vec3(0.4, 0.65, 0.75);          // Light blue-white
        
        // Height and slope-based coloring
        float heightFactor = vHeight / max(uWaveScale, 0.01);
        float heightNorm = heightFactor * 0.5 + 0.5;
        
        // Slope (steepness) affects color
        float slope = 1.0 - normal.y;
        float steepness = smoothstep(0.1, 0.4, slope);
        
        // Base water color
        vec3 waterColor = mix(deepOceanColor, shallowWaterColor, heightNorm * 0.7 + 0.3);
        waterColor = mix(waterColor, foamyColor, steepness * 0.3);
        
        // Subsurface scattering hint (light penetrates water slightly)
        float subsurface = pow(max(0.0, dot(-normal, lightDir)), 2.0) * 0.3;
        vec3 sssColor = vec3(0.0, 0.4, 0.5) * subsurface;
        
        // Diffuse lighting
        vec3 diffuse = uSunColor * NdotL * waterColor * 0.8;
        
        // Improved specular (GGX-like)
        float roughness = 0.05; // Very smooth water
        float alpha = roughness * roughness;
        float alpha2 = alpha * alpha;
        float denom = (NdotH * NdotH * (alpha2 - 1.0) + 1.0);
        float D = alpha2 / (PI * denom * denom);
        float specularStrength = D * NdotL * 0.3;
        vec3 specular = uSunColor * specularStrength;
        
        // Schlick fresnel (water F0 = 0.02)
        vec3 F0 = vec3(0.02);
        vec3 F = fresnelSchlick(NdotV, F0);
        
        // Sky reflection
        vec3 skyRefl = skyColor(reflectDir);
        vec3 sunRefl = vec3(1.0) * sunDisk(reflectDir, lightDir);
        vec3 envReflection = (skyRefl + sunRefl) * F;
        
        // Enhanced foam (on wave crests and steep slopes)
        float foamHeight = smoothstep(0.3, 0.6, heightNorm);
        float foamSteep = smoothstep(0.2, 0.5, steepness);
        float foamFactor = max(foamHeight, foamSteep * 0.7);
        vec3 foam = vec3(0.95, 0.98, 1.0) * foamFactor * 0.6;
        
        // Ambient lighting (sky ambient)
        vec3 ambient = skyColor(normal) * 0.15;
        
        // Distance fog
        float dist = length(vWorldPos - cameraPosition);
        float fogFactor = 1.0 - exp(-dist * 0.003);
        vec3 fogColor = vec3(0.6, 0.75, 0.85);
        
        // Combine all lighting
        vec3 color = ambient + diffuse + specular + envReflection + sssColor + foam;
        
        // Apply fog
        color = mix(color, fogColor, fogFactor * 0.3);
        
        // Tone mapping (ACES-like)
        color = color / (color + 0.6);
        
        // Gamma correction
        color = pow(color, vec3(1.0 / 2.2));
        
        gl_FragColor = vec4(color, 1.0);
      }
    }
  `
};

const oceanMaterial = new THREE.ShaderMaterial(oceanShader);
const ocean = new THREE.Mesh(oceanGeo, oceanMaterial);
scene.add(ocean);

// === ISLAND (ROCK OBSTACLE) ===
const islandRadius = ISLAND_RADIUS * 100; // Convert to world units
const islandGeo = new THREE.CylinderGeometry(islandRadius, islandRadius * 1.3, 8, 16);
const islandMat = new THREE.MeshStandardMaterial({
  color: 0x8B7355,  // Brown-gray rock
  roughness: 0.9,
  metalness: 0.1
});
const island = new THREE.Mesh(islandGeo, islandMat);
island.position.set(
  (ISLAND_CENTER_X - 0.5) * 100,
  2, // Slightly above water
  (ISLAND_CENTER_Y - 0.5) * 100
);
scene.add(island);

// Add directional light for island
const sunLight = new THREE.DirectionalLight(0xffe8c0, 1.5);
sunLight.position.set(-50, 60, -70);
scene.add(sunLight);

const ambientLight = new THREE.AmbientLight(0x87CEEB, 0.4);
scene.add(ambientLight);

// === CONTROLS ===
const orbit = { th: 0, ph: Math.PI / 6, r: 50, drag: false, lx: 0, ly: 0 };

function updateCamera() {
  camera.position.set(
    orbit.r * Math.sin(orbit.ph) * Math.cos(orbit.th),
    orbit.r * Math.cos(orbit.ph),
    orbit.r * Math.sin(orbit.ph) * Math.sin(orbit.th)
  );
  camera.lookAt(0, 0, 0);
}
updateCamera();

canvas.addEventListener('mousedown', e => {
  orbit.drag = true;
  orbit.lx = e.clientX;
  orbit.ly = e.clientY;
});
canvas.addEventListener('mousemove', e => {
  if (orbit.drag) {
    const dx = e.clientX - orbit.lx;
    const dy = e.clientY - orbit.ly;
    orbit.lx = e.clientX;
    orbit.ly = e.clientY;
    orbit.th -= dx * 0.005;
    orbit.ph = Math.max(0.1, Math.min(Math.PI * 0.49, orbit.ph - dy * 0.005));
    updateCamera();
  }
});
canvas.addEventListener('mouseup', () => orbit.drag = false);
canvas.addEventListener('wheel', e => {
  orbit.r = Math.max(10, Math.min(150, orbit.r * (1 + e.deltaY * 0.001)));
  updateCamera();
  e.preventDefault();
}, { passive: false });

// Click to add wave
canvas.addEventListener('click', e => {
  if (!orbit.drag) {
    const rect = canvas.getBoundingClientRect();
    const x = (e.clientX - rect.left) / rect.width;
    const y = (e.clientY - rect.top) / rect.height;
    
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2(x * 2 - 1, -(y * 2 - 1));
    raycaster.setFromCamera(mouse, camera);
    
    const intersects = raycaster.intersectObject(ocean);
    if (intersects.length > 0) {
      const point = intersects[0].point;
      const uvX = (point.x + 50) / 100;
      const uvZ = (point.z + 50) / 100;
      addWaveAt(uvX, uvZ, 0.5);
    }
  }
});

// Touch controls
let touchDist = 0;
canvas.addEventListener('touchstart', e => {
  if (e.touches.length === 1) {
    orbit.drag = true;
    orbit.lx = e.touches[0].clientX;
    orbit.ly = e.touches[0].clientY;
  } else if (e.touches.length === 2) {
    orbit.drag = false;
    touchDist = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY
    );
  }
});
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if (e.touches.length === 1 && orbit.drag) {
    const dx = e.touches[0].clientX - orbit.lx;
    const dy = e.touches[0].clientY - orbit.ly;
    orbit.lx = e.touches[0].clientX;
    orbit.ly = e.touches[0].clientY;
    orbit.th -= dx * 0.005;
    orbit.ph = Math.max(0.1, Math.min(Math.PI * 0.49, orbit.ph - dy * 0.005));
    updateCamera();
  } else if (e.touches.length === 2) {
    const newDist = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY
    );
    orbit.r = Math.max(10, Math.min(150, orbit.r * (touchDist / newDist)));
    touchDist = newDist;
    updateCamera();
  }
}, { passive: false });
canvas.addEventListener('touchend', () => orbit.drag = false);

// === UI CONTROLS ===
document.getElementById('windAngle').addEventListener('input', e => {
  windAngle = parseFloat(e.target.value) * Math.PI / 180;
  document.getElementById('windAngle_v').textContent = e.target.value + '°';
});

document.getElementById('windStrength').addEventListener('input', e => {
  windStrength = parseFloat(e.target.value);
  document.getElementById('windStrength_v').textContent = e.target.value;
});

document.getElementById('waveScale').addEventListener('input', e => {
  waveScale = parseFloat(e.target.value);
  oceanMaterial.uniforms.uWaveScale.value = waveScale;
  document.getElementById('waveScale_v').textContent = e.target.value;
});

document.getElementById('debugMode').addEventListener('change', e => {
  debugMode = e.target.checked;
  oceanMaterial.uniforms.uDebugMode.value = debugMode;
});

document.getElementById('randomDrop').addEventListener('click', () => {
  addWaveAt(Math.random(), Math.random(), 0.5);
});

document.getElementById('clearWaves').addEventListener('click', () => {
  h0.fill(0);
  h1.fill(0);
  h2.fill(0);
});

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// === UPDATE TEXTURE FROM CPU DATA ===
function updateTexture() {
  for (let i = 0; i < size * size; i++) {
    // Encode float height (-10 to +10) into byte range (0-255)
    const h = h1[i];
    const normalized = (h + 10.0) / 20.0; // Map [-10,10] to [0,1]
    const clamped = Math.max(0, Math.min(1, normalized));
    const byte = Math.floor(clamped * 255);
    
    texData[i * 4] = byte;       // R = height
    texData[i * 4 + 1] = 0;      // G
    texData[i * 4 + 2] = 0;      // B
    texData[i * 4 + 3] = 255;    // A
  }
  heightTexture.needsUpdate = true;
}

// === ANIMATION LOOP ===
let lastTime = performance.now();
let frameCount = 0;
let fpsUpdateTime = lastTime;
let debugFrameCount = 0;

addInitialWaves(); // Add 3 waves on start

console.log('[INIT] Initial waves added. Checking h1 buffer...');
let maxH = 0, nonZero = 0;
for (let i = 0; i < h1.length; i++) {
  if (Math.abs(h1[i]) > 0.001) {
    nonZero++;
    maxH = Math.max(maxH, Math.abs(h1[i]));
  }
}
console.log(`[INIT] Non-zero cells: ${nonZero}, max height: ${maxH.toFixed(3)}`);

function animate() {
  requestAnimationFrame(animate);
  
  const now = performance.now();
  const dt = Math.min((now - lastTime) / 1000, 0.033); // Cap at 30 FPS equivalent
  lastTime = now;
  
  // Random wind ripples (spawn periodically when wind is active)
  if (windStrength > 0.5 && now - lastRippleTime > 1000) {
    // Spawn 1-3 random ripples away from island
    const numRipples = Math.floor(Math.random() * 3) + 1;
    for (let i = 0; i < numRipples; i++) {
      let rx, ry, distToIsland;
      let attempts = 0;
      do {
        rx = Math.random();
        ry = Math.random();
        const dx = rx - ISLAND_CENTER_X;
        const dy = ry - ISLAND_CENTER_Y;
        distToIsland = Math.sqrt(dx*dx + dy*dy);
        attempts++;
      } while (distToIsland < ISLAND_RADIUS * 1.5 && attempts < 10); // Avoid island
      
      if (distToIsland >= ISLAND_RADIUS * 1.5) {
        addWaveAt(rx, ry, 0.15 + Math.random() * 0.1);
      }
    }
    lastRippleTime = now;
  }
  
  // Run simulation
  stepSimulation(dt);
  updateTexture();
  
  // Debug logging every 60 frames
  debugFrameCount++;
  if (debugFrameCount === 60) {
    let maxH = 0, nonZero = 0;
    for (let i = 0; i < h1.length; i++) {
      if (Math.abs(h1[i]) > 0.001) {
        nonZero++;
        maxH = Math.max(maxH, Math.abs(h1[i]));
      }
    }
    console.log(`[FRAME 60] Non-zero: ${nonZero}, max: ${maxH.toFixed(3)}`);
    debugFrameCount = 0;
  }
  
  // Render
  renderer.render(scene, camera);
  
  // FPS
  frameCount++;
  if (now - fpsUpdateTime > 1000) {
    document.getElementById('fps').textContent = frameCount;
    frameCount = 0;
    fpsUpdateTime = now;
  }
}

animate();
</script>
