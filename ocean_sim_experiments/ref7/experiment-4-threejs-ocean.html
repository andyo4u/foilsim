<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Experiment 4: Three.js Ocean Style</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; font-family: 'Segoe UI', sans-serif; background: #000; touch-action: none; }
canvas { display: block; }
#info {
  position: absolute;
  top: 10px;
  left: 10px;
  color: #fff;
  background: rgba(0,0,0,0.5);
  padding: 10px;
  border-radius: 5px;
  font-size: 14px;
}
#controls {
  position: absolute;
  top: 10px;
  right: 10px;
  background: rgba(0,0,0,0.8);
  padding: 15px;
  border-radius: 8px;
  color: #fff;
  font-size: 13px;
  max-width: 280px;
}
.control-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin: 8px 0;
}
.control-row label { flex: 1; }
.control-row .right { flex: 1; text-align: right; }
input[type="range"] { width: 140px; }
.val { display: inline-block; min-width: 45px; text-align: right; margin-left: 8px; }
</style>
</head>
<body>
<div id="info">Three.js Ocean Style · <span id="fps">0</span> FPS</div>
<div id="controls">
  <h3 style="margin-bottom:10px">Ocean Controls</h3>
  
  <div class="control-row">
    <label>Wave Size</label>
    <div class="right">
      <input type="range" id="size" min="0.1" max="3" step="0.1" value="1.0">
      <span class="val" id="size_v">1.0</span>
    </div>
  </div>
  
  <div class="control-row">
    <label>Choppiness</label>
    <div class="right">
      <input type="range" id="choppiness" min="0" max="10" step="0.5" value="4.0">
      <span class="val" id="choppiness_v">4.0</span>
    </div>
  </div>
  
  <div class="control-row">
    <label>Speed</label>
    <div class="right">
      <input type="range" id="speed" min="0.1" max="2" step="0.1" value="1.0">
      <span class="val" id="speed_v">1.0</span>
    </div>
  </div>
  
  <div class="control-row">
    <label>Sun Intensity</label>
    <div class="right">
      <input type="range" id="sunIntensity" min="0" max="2" step="0.1" value="1.0">
      <span class="val" id="sunIntensity_v">1.0</span>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// === PARAMETERS ===
let parameters = {
  size: 1.0,
  choppiness: 4.0,
  speed: 1.0,
  sunIntensity: 1.0
};

// === SCENE SETUP ===
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x000000, 1, 3000);

const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 1, 20000);
camera.position.set(30, 30, 100);

// === LIGHTING ===
const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
scene.add(ambientLight);

const directionalLight = new THREE.DirectionalLight(0xffaa77, 1.0);
directionalLight.position.set(-1, 0.75, -1);
scene.add(directionalLight);

// === SKY ===
const skyGeo = new THREE.SphereGeometry(10000, 32, 15);
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide,
  uniforms: {
    uSunDirection: { value: new THREE.Vector3(-1, 0.75, -1).normalize() },
    uSkyColor: { value: new THREE.Color(0x88ccee) }
  },
  vertexShader: `
    varying vec3 vWorldPosition;
    void main() {
      vec4 worldPosition = modelMatrix * vec4(position, 1.0);
      vWorldPosition = worldPosition.xyz;
      gl_Position = projectionMatrix * viewMatrix * worldPosition;
    }
  `,
  fragmentShader: `
    uniform vec3 uSunDirection;
    uniform vec3 uSkyColor;
    varying vec3 vWorldPosition;
    
    void main() {
      vec3 direction = normalize(vWorldPosition);
      float elevation = max(0.0, direction.y);
      
      // Sky gradient
      vec3 horizonColor = vec3(0.8, 0.85, 0.9);
      vec3 zenithColor = vec3(0.4, 0.6, 0.85);
      vec3 skyColor = mix(horizonColor, zenithColor, pow(elevation, 0.6));
      
      // Sun disk
      float sunDot = max(0.0, dot(direction, -uSunDirection));
      float sun = pow(sunDot, 256.0);
      vec3 sunColor = vec3(1.0, 0.95, 0.8) * sun * 3.0;
      
      // Sun glow
      float glow = pow(sunDot, 4.0) * 0.5;
      
      vec3 finalColor = skyColor + sunColor + glow * vec3(1.0, 0.8, 0.6);
      
      gl_FragColor = vec4(finalColor, 1.0);
    }
  `
});
const sky = new THREE.Mesh(skyGeo, skyMat);
scene.add(sky);

// === WATER GEOMETRY ===
const waterGeo = new THREE.PlaneGeometry(2000, 2000, 512, 512);

// === GERSTNER WAVE SHADER ===
const waterMat = new THREE.ShaderMaterial({
  uniforms: {
    uTime: { value: 0 },
    uSize: { value: parameters.size },
    uChoppiness: { value: parameters.choppiness },
    uSunDirection: { value: new THREE.Vector3(-1, 0.75, -1).normalize() },
    uSunColor: { value: new THREE.Color(0xffaa77) },
    uSunIntensity: { value: parameters.sunIntensity }
  },
  vertexShader: `
    uniform float uTime;
    uniform float uSize;
    uniform float uChoppiness;
    
    varying vec3 vPosition;
    varying vec3 vNormal;
    
    #define PI 3.14159265359
    
    // Gerstner wave function
    vec3 gerstnerWave(vec2 pos, float wavelength, vec2 direction, float steepness, float speed) {
      float k = 2.0 * PI / wavelength;
      float c = sqrt(9.8 / k);
      vec2 d = normalize(direction);
      float f = k * dot(d, pos) - speed * c * uTime;
      float a = steepness / k;
      
      return vec3(
        d.x * a * cos(f),
        a * sin(f),
        d.y * a * cos(f)
      );
    }
    
    // Calculate tangent for normal
    vec3 gerstnerWaveTangent(vec2 pos, float wavelength, vec2 direction, float steepness, float speed) {
      float k = 2.0 * PI / wavelength;
      float c = sqrt(9.8 / k);
      vec2 d = normalize(direction);
      float f = k * dot(d, pos) - speed * c * uTime;
      float a = steepness / k;
      
      return vec3(
        -d.x * d.x * steepness * sin(f),
        d.x * k * a * cos(f),
        -d.x * d.y * steepness * sin(f)
      );
    }
    
    vec3 gerstnerWaveBinormal(vec2 pos, float wavelength, vec2 direction, float steepness, float speed) {
      float k = 2.0 * PI / wavelength;
      float c = sqrt(9.8 / k);
      vec2 d = normalize(direction);
      float f = k * dot(d, pos) - speed * c * uTime;
      float a = steepness / k;
      
      return vec3(
        -d.x * d.y * steepness * sin(f),
        d.y * k * a * cos(f),
        -d.y * d.y * steepness * sin(f)
      );
    }
    
    void main() {
      vec2 pos = position.xy;
      vec3 offset = vec3(0.0);
      vec3 tangent = vec3(1.0, 0.0, 0.0);
      vec3 binormal = vec3(0.0, 0.0, 1.0);
      
      float steepness = uChoppiness / 10.0;
      
      // Multiple Gerstner waves
      offset += gerstnerWave(pos, 60.0 * uSize, vec2(1.0, 0.0), steepness, 1.0);
      tangent += gerstnerWaveTangent(pos, 60.0 * uSize, vec2(1.0, 0.0), steepness, 1.0);
      binormal += gerstnerWaveBinormal(pos, 60.0 * uSize, vec2(1.0, 0.0), steepness, 1.0);
      
      offset += gerstnerWave(pos, 31.0 * uSize, vec2(1.0, 0.3), steepness * 0.8, 1.1);
      tangent += gerstnerWaveTangent(pos, 31.0 * uSize, vec2(1.0, 0.3), steepness * 0.8, 1.1);
      binormal += gerstnerWaveBinormal(pos, 31.0 * uSize, vec2(1.0, 0.3), steepness * 0.8, 1.1);
      
      offset += gerstnerWave(pos, 18.0 * uSize, vec2(1.0, 0.7), steepness * 0.6, 0.9);
      tangent += gerstnerWaveTangent(pos, 18.0 * uSize, vec2(1.0, 0.7), steepness * 0.6, 0.9);
      binormal += gerstnerWaveBinormal(pos, 18.0 * uSize, vec2(1.0, 0.7), steepness * 0.6, 0.9);
      
      offset += gerstnerWave(pos, 9.0 * uSize, vec2(1.0, 1.0), steepness * 0.4, 1.3);
      tangent += gerstnerWaveTangent(pos, 9.0 * uSize, vec2(1.0, 1.0), steepness * 0.4, 1.3);
      binormal += gerstnerWaveBinormal(pos, 9.0 * uSize, vec2(1.0, 1.0), steepness * 0.4, 1.3);
      
      vec3 worldPos = position + offset;
      vPosition = worldPos;
      
      // Calculate normal from tangent and binormal
      vNormal = normalize(cross(binormal, tangent));
      
      gl_Position = projectionMatrix * modelViewMatrix * vec4(worldPos, 1.0);
    }
  `,
  fragmentShader: `
    uniform vec3 uSunDirection;
    uniform vec3 uSunColor;
    uniform float uSunIntensity;
    
    varying vec3 vPosition;
    varying vec3 vNormal;
    
    void main() {
      vec3 normal = normalize(vNormal);
      vec3 viewDir = normalize(cameraPosition - vPosition);
      vec3 lightDir = normalize(-uSunDirection);
      
      // Water colors
      vec3 waterColorDeep = vec3(0.0, 0.05, 0.15);
      vec3 waterColorShallow = vec3(0.0, 0.2, 0.3);
      
      // Fresnel effect
      float fresnel = pow(1.0 - max(0.0, dot(viewDir, normal)), 5.0);
      
      // Reflection
      vec3 reflectDir = reflect(-viewDir, normal);
      float skyElevation = max(0.0, reflectDir.y);
      vec3 skyReflection = mix(vec3(0.7, 0.8, 0.9), vec3(0.3, 0.5, 0.8), pow(skyElevation, 0.6));
      
      // Sun reflection
      float sunDot = max(0.0, dot(reflectDir, -uSunDirection));
      float sunReflection = pow(sunDot, 200.0) * uSunIntensity;
      vec3 sunColor = uSunColor * sunReflection * 2.0;
      
      // Diffuse
      float NdotL = max(0.0, dot(normal, lightDir));
      vec3 diffuse = mix(waterColorDeep, waterColorShallow, NdotL * 0.5 + 0.5);
      
      // Combine
      vec3 color = mix(diffuse, skyReflection, fresnel * 0.9) + sunColor;
      
      // Atmospheric fog
      float dist = length(vPosition - cameraPosition);
      float fogFactor = 1.0 - exp(-dist * 0.0003);
      vec3 fogColor = vec3(0.7, 0.8, 0.85);
      color = mix(color, fogColor, fogFactor);
      
      gl_FragColor = vec4(color, 1.0);
    }
  `
});

const water = new THREE.Mesh(waterGeo, waterMat);
water.rotation.x = -Math.PI / 2;
scene.add(water);

// === CONTROLS ===
let controls = {
  theta: 0,
  phi: Math.PI / 6,
  radius: 100,
  dragging: false,
  lastX: 0,
  lastY: 0
};

function updateCamera() {
  camera.position.x = controls.radius * Math.sin(controls.phi) * Math.cos(controls.theta);
  camera.position.y = controls.radius * Math.cos(controls.phi);
  camera.position.z = controls.radius * Math.sin(controls.phi) * Math.sin(controls.theta);
  camera.lookAt(0, 0, 0);
}

// Mouse controls
renderer.domElement.addEventListener('mousedown', e => {
  controls.dragging = true;
  controls.lastX = e.clientX;
  controls.lastY = e.clientY;
});

renderer.domElement.addEventListener('mousemove', e => {
  if (controls.dragging) {
    const dx = e.clientX - controls.lastX;
    const dy = e.clientY - controls.lastY;
    controls.lastX = e.clientX;
    controls.lastY = e.clientY;
    
    controls.theta -= dx * 0.005;
    controls.phi = Math.max(0.1, Math.min(Math.PI / 2 - 0.1, controls.phi - dy * 0.005));
    updateCamera();
  }
});

renderer.domElement.addEventListener('mouseup', () => controls.dragging = false);

renderer.domElement.addEventListener('wheel', e => {
  controls.radius = Math.max(20, Math.min(500, controls.radius + e.deltaY * 0.1));
  updateCamera();
  e.preventDefault();
}, { passive: false });

// Touch controls
let touchDist = 0;
renderer.domElement.addEventListener('touchstart', e => {
  if (e.touches.length === 1) {
    controls.dragging = true;
    controls.lastX = e.touches[0].clientX;
    controls.lastY = e.touches[0].clientY;
  } else if (e.touches.length === 2) {
    controls.dragging = false;
    touchDist = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY
    );
  }
});

renderer.domElement.addEventListener('touchmove', e => {
  e.preventDefault();
  if (e.touches.length === 1 && controls.dragging) {
    const dx = e.touches[0].clientX - controls.lastX;
    const dy = e.touches[0].clientY - controls.lastY;
    controls.lastX = e.touches[0].clientX;
    controls.lastY = e.touches[0].clientY;
    
    controls.theta -= dx * 0.005;
    controls.phi = Math.max(0.1, Math.min(Math.PI / 2 - 0.1, controls.phi - dy * 0.005));
    updateCamera();
  } else if (e.touches.length === 2) {
    const newDist = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY
    );
    controls.radius = Math.max(20, Math.min(500, controls.radius * (touchDist / newDist)));
    touchDist = newDist;
    updateCamera();
  }
}, { passive: false });

renderer.domElement.addEventListener('touchend', () => controls.dragging = false);

// UI controls
document.getElementById('size').addEventListener('input', e => {
  parameters.size = parseFloat(e.target.value);
  waterMat.uniforms.uSize.value = parameters.size;
  document.getElementById('size_v').textContent = e.target.value;
});

document.getElementById('choppiness').addEventListener('input', e => {
  parameters.choppiness = parseFloat(e.target.value);
  waterMat.uniforms.uChoppiness.value = parameters.choppiness;
  document.getElementById('choppiness_v').textContent = e.target.value;
});

document.getElementById('speed').addEventListener('input', e => {
  parameters.speed = parseFloat(e.target.value);
  document.getElementById('speed_v').textContent = e.target.value;
});

document.getElementById('sunIntensity').addEventListener('input', e => {
  parameters.sunIntensity = parseFloat(e.target.value);
  waterMat.uniforms.uSunIntensity.value = parameters.sunIntensity;
  document.getElementById('sunIntensity_v').textContent = e.target.value;
});

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// === ANIMATION LOOP ===
let lastTime = performance.now();
let frameCount = 0;
let fpsTime = lastTime;

function animate() {
  requestAnimationFrame(animate);
  
  const now = performance.now();
  const delta = (now - lastTime) / 1000;
  lastTime = now;
  
  // Update water time
  waterMat.uniforms.uTime.value += delta * parameters.speed;
  
  // Render
  renderer.render(scene, camera);
  
  // FPS
  frameCount++;
  if (now - fpsTime > 1000) {
    document.getElementById('fps').textContent = frameCount;
    frameCount = 0;
    fpsTime = now;
  }
}

updateCamera();
animate();
</script>
</body>
</html>
