<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Experiment 5: Wind-Driven Ocean</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; font-family: 'Segoe UI', sans-serif; background: #000; touch-action: none; }
canvas { display: block; }
#info {
  position: absolute;
  top: 10px;
  left: 10px;
  color: #fff;
  background: rgba(0,0,0,0.5);
  padding: 10px;
  border-radius: 5px;
  font-size: 14px;
}
#controls {
  position: absolute;
  top: 10px;
  right: 10px;
  background: rgba(0,0,0,0.8);
  padding: 15px;
  border-radius: 8px;
  color: #fff;
  font-size: 13px;
  max-width: 300px;
}
.control-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin: 8px 0;
}
.control-row label { flex: 1; }
.control-row .right { flex: 1; text-align: right; }
input[type="range"] { width: 140px; }
.val { display: inline-block; min-width: 45px; text-align: right; margin-left: 8px; }
button {
  background: #2a5;
  color: #fff;
  border: none;
  padding: 8px 16px;
  border-radius: 4px;
  cursor: pointer;
  margin: 4px 0;
  width: 100%;
}
button:active { background: #1a4; }
</style>
</head>
<body>
<div id="info">Wind-Driven Ocean · <span id="fps">0</span> FPS</div>
<div id="controls">
  <h3 style="margin-bottom:10px">Wind Controls</h3>
  
  <div class="control-row">
    <label>Wind Strength</label>
    <div class="right">
      <input type="range" id="windStrength" min="0" max="10" step="0.5" value="3.0">
      <span class="val" id="windStrength_v">3.0</span>
    </div>
  </div>
  
  <div class="control-row">
    <label>Wind Direction</label>
    <div class="right">
      <input type="range" id="windAngle" min="0" max="360" step="5" value="45">
      <span class="val" id="windAngle_v">45°</span>
    </div>
  </div>
  
  <div class="control-row">
    <label>Wave Scale</label>
    <div class="right">
      <input type="range" id="waveScale" min="0.1" max="5" step="0.1" value="2.0">
      <span class="val" id="waveScale_v">2.0</span>
    </div>
  </div>
  
  <button id="addDrop">Add Water Drop</button>
  <button id="clearWaves">Clear All Waves</button>
  
  <div style="margin-top:10px; font-size:11px; opacity:0.7;">
    Wind gradually builds waves across the surface. Click/tap water to add drops.
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// === SIMULATION PARAMETERS ===
const SIM_SIZE = 256;
const MESH_SIZE = 128;

let waveSpeed = 1.5;
let damping = 0.995;
let waveScale = 2.0;
let windAngle = 45 * Math.PI / 180;
let windStrength = 3.0;

// === CPU SIMULATION BUFFERS ===
let h0 = new Float32Array(SIM_SIZE * SIM_SIZE);
let h1 = new Float32Array(SIM_SIZE * SIM_SIZE);
let h2 = new Float32Array(SIM_SIZE * SIM_SIZE);

h0.fill(0);
h1.fill(0);
h2.fill(0);

// Wind ripple sources (spawn periodically)
let lastRippleTime = 0;

function addWaveAt(x, y, strength) {
  const cx = Math.floor(x * SIM_SIZE);
  const cy = Math.floor(y * SIM_SIZE);
  const radius = Math.floor(SIM_SIZE * 0.03);
  
  for (let dy = -radius; dy <= radius; dy++) {
    for (let dx = -radius; dx <= radius; dx++) {
      const px = cx + dx;
      const py = cy + dy;
      if (px >= 0 && px < SIM_SIZE && py >= 0 && py < SIM_SIZE) {
        const dist = Math.sqrt(dx*dx + dy*dy);
        if (dist <= radius) {
          const influence = Math.exp(-dist * dist / (radius * radius));
          const idx = py * SIM_SIZE + px;
          h1[idx] += strength * influence;
        }
      }
    }
  }
}

// Wave equation simulation
function stepSimulation(dt) {
  const c2 = waveSpeed * waveSpeed;
  const dt2 = dt * dt;
  const dx = 1.0;
  
  const windDx = Math.cos(windAngle);
  const windDy = Math.sin(windAngle);
  
  for (let y = 1; y < SIM_SIZE - 1; y++) {
    for (let x = 1; x < SIM_SIZE - 1; x++) {
      const idx = y * SIM_SIZE + x;
      
      const h_curr = h1[idx];
      const h_prev = h0[idx];
      
      // Neighbors
      const h_right = h1[idx + 1];
      const h_left = h1[idx - 1];
      const h_up = h1[idx + SIM_SIZE];
      const h_down = h1[idx - SIM_SIZE];
      
      const laplacian = (h_right + h_left + h_up + h_down - 4 * h_curr) / (dx * dx);
      
      // Wave equation
      let h_next = 2 * h_curr - h_prev + c2 * dt2 * laplacian;
      
      // Wind forcing (pushes in wind direction)
      const gradX = (h_right - h_left) / (2 * dx);
      const gradY = (h_up - h_down) / (2 * dx);
      const windForce = windStrength * (windDx * gradX + windDy * gradY) * 0.1;
      h_next += windForce * dt;
      
      // Wind seed forcing (creates ambient ripples)
      const t = Date.now() * 0.001;
      const noise1 = Math.sin(x * 0.3 + y * 0.3 + t * 2.0);
      const noise2 = Math.sin(x * 0.7 - y * 0.5 + t * 3.0) * 0.5;
      const noise3 = Math.sin(x * 1.2 + y * 0.9 + t * 1.5) * 0.25;
      const combinedNoise = (noise1 + noise2 + noise3) / 1.75;
      h_next += windStrength * 0.003 * combinedNoise;
      
      // Damping
      h_next *= damping;
      
      // Absorbing boundaries
      const edgeX = Math.min(x, SIM_SIZE - 1 - x) / SIM_SIZE;
      const edgeY = Math.min(y, SIM_SIZE - 1 - y) / SIM_SIZE;
      const edgeDist = Math.min(edgeX, edgeY);
      const boundaryDamp = Math.min(1, edgeDist / 0.05);
      h_next *= boundaryDamp;
      
      h2[idx] = h_next;
    }
  }
  
  // Swap buffers
  const temp = h0;
  h0 = h1;
  h1 = h2;
  h2 = temp;
}

// === THREE.JS SETUP ===
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x000000, 1, 3000);

const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 1, 20000);
camera.position.set(30, 30, 100);

// === LIGHTING ===
const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
scene.add(ambientLight);

const directionalLight = new THREE.DirectionalLight(0xffaa77, 1.0);
directionalLight.position.set(-1, 0.75, -1);
scene.add(directionalLight);

// === SKY ===
const skyGeo = new THREE.SphereGeometry(10000, 32, 15);
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide,
  uniforms: {
    uSunDirection: { value: new THREE.Vector3(-1, 0.75, -1).normalize() }
  },
  vertexShader: `
    varying vec3 vWorldPosition;
    void main() {
      vec4 worldPosition = modelMatrix * vec4(position, 1.0);
      vWorldPosition = worldPosition.xyz;
      gl_Position = projectionMatrix * viewMatrix * worldPosition;
    }
  `,
  fragmentShader: `
    uniform vec3 uSunDirection;
    varying vec3 vWorldPosition;
    
    void main() {
      vec3 direction = normalize(vWorldPosition);
      float elevation = max(0.0, direction.y);
      
      vec3 horizonColor = vec3(0.8, 0.85, 0.9);
      vec3 zenithColor = vec3(0.4, 0.6, 0.85);
      vec3 skyColor = mix(horizonColor, zenithColor, pow(elevation, 0.6));
      
      float sunDot = max(0.0, dot(direction, -uSunDirection));
      float sun = pow(sunDot, 256.0);
      vec3 sunColor = vec3(1.0, 0.95, 0.8) * sun * 3.0;
      float glow = pow(sunDot, 4.0) * 0.5;
      
      vec3 finalColor = skyColor + sunColor + glow * vec3(1.0, 0.8, 0.6);
      gl_FragColor = vec4(finalColor, 1.0);
    }
  `
});
const sky = new THREE.Mesh(skyGeo, skyMat);
scene.add(sky);

// === WATER MESH ===
const waterGeo = new THREE.PlaneGeometry(100, 100, MESH_SIZE - 1, MESH_SIZE - 1);
waterGeo.rotateX(-Math.PI / 2);

// Height texture
const texData = new Uint8Array(SIM_SIZE * SIM_SIZE * 4);
const heightTexture = new THREE.DataTexture(texData, SIM_SIZE, SIM_SIZE, THREE.RGBAFormat, THREE.UnsignedByteType);
heightTexture.minFilter = THREE.LinearFilter;
heightTexture.magFilter = THREE.LinearFilter;

const waterMat = new THREE.ShaderMaterial({
  uniforms: {
    uHeightfield: { value: heightTexture },
    uWaveScale: { value: waveScale },
    uSunDirection: { value: new THREE.Vector3(-1, 0.75, -1).normalize() },
    uSunColor: { value: new THREE.Color(0xffaa77) }
  },
  vertexShader: `
    uniform sampler2D uHeightfield;
    uniform float uWaveScale;
    
    varying vec3 vPosition;
    varying vec3 vNormal;
    varying vec2 vUv;
    
    vec3 calculateNormal() {
      float texelSize = 1.0 / 256.0;
      vec2 uv = (position.xz + 50.0) / 100.0;
      
      // Decode heights
      float h_c = (texture2D(uHeightfield, uv).r * 20.0 - 10.0) * uWaveScale;
      float h_r = (texture2D(uHeightfield, uv + vec2(texelSize, 0.0)).r * 20.0 - 10.0) * uWaveScale;
      float h_l = (texture2D(uHeightfield, uv - vec2(texelSize, 0.0)).r * 20.0 - 10.0) * uWaveScale;
      float h_u = (texture2D(uHeightfield, uv + vec2(0.0, texelSize)).r * 20.0 - 10.0) * uWaveScale;
      float h_d = (texture2D(uHeightfield, uv - vec2(0.0, texelSize)).r * 20.0 - 10.0) * uWaveScale;
      
      vec3 tangentX = vec3(2.0 * texelSize * 100.0, h_r - h_l, 0.0);
      vec3 tangentZ = vec3(0.0, h_u - h_d, 2.0 * texelSize * 100.0);
      
      return normalize(cross(tangentZ, tangentX));
    }
    
    void main() {
      vUv = (position.xz + 50.0) / 100.0;
      
      float height = (texture2D(uHeightfield, vUv).r * 20.0 - 10.0) * uWaveScale;
      
      vec3 pos = position;
      pos.y = height;
      
      vPosition = (modelMatrix * vec4(pos, 1.0)).xyz;
      vNormal = calculateNormal();
      
      gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
    }
  `,
  fragmentShader: `
    uniform vec3 uSunDirection;
    uniform vec3 uSunColor;
    
    varying vec3 vPosition;
    varying vec3 vNormal;
    varying vec2 vUv;
    
    void main() {
      vec3 normal = normalize(vNormal);
      vec3 viewDir = normalize(cameraPosition - vPosition);
      vec3 lightDir = normalize(-uSunDirection);
      
      // Water colors
      vec3 waterColorDeep = vec3(0.0, 0.05, 0.15);
      vec3 waterColorShallow = vec3(0.0, 0.2, 0.35);
      
      // Fresnel
      float fresnel = pow(1.0 - max(0.0, dot(viewDir, normal)), 5.0);
      
      // Sky reflection
      vec3 reflectDir = reflect(-viewDir, normal);
      float skyElevation = max(0.0, reflectDir.y);
      vec3 skyReflection = mix(vec3(0.7, 0.8, 0.9), vec3(0.3, 0.5, 0.8), pow(skyElevation, 0.6));
      
      // Sun reflection
      float sunDot = max(0.0, dot(reflectDir, -uSunDirection));
      float sunReflection = pow(sunDot, 200.0);
      vec3 sunColor = uSunColor * sunReflection * 2.0;
      
      // Diffuse
      float NdotL = max(0.0, dot(normal, lightDir));
      vec3 diffuse = mix(waterColorDeep, waterColorShallow, NdotL * 0.5 + 0.5);
      
      // Foam on wave tips
      float height = vPosition.y;
      float foamFactor = smoothstep(0.3, 0.8, height / 2.0);
      vec3 foam = vec3(0.9, 0.95, 1.0) * foamFactor * 0.5;
      
      // Combine
      vec3 color = mix(diffuse, skyReflection, fresnel * 0.9) + sunColor + foam;
      
      // Fog
      float dist = length(vPosition - cameraPosition);
      float fogFactor = 1.0 - exp(-dist * 0.0003);
      vec3 fogColor = vec3(0.7, 0.8, 0.85);
      color = mix(color, fogColor, fogFactor);
      
      gl_FragColor = vec4(color, 1.0);
    }
  `
});

const water = new THREE.Mesh(waterGeo, waterMat);
scene.add(water);

// === UPDATE TEXTURE ===
function updateTexture() {
  for (let i = 0; i < SIM_SIZE * SIM_SIZE; i++) {
    const h = h1[i];
    const normalized = (h + 10.0) / 20.0;
    const clamped = Math.max(0, Math.min(1, normalized));
    const byte = Math.floor(clamped * 255);
    
    texData[i * 4] = byte;
    texData[i * 4 + 1] = 0;
    texData[i * 4 + 2] = 0;
    texData[i * 4 + 3] = 255;
  }
  heightTexture.needsUpdate = true;
}

// === CONTROLS ===
let controls = {
  theta: 0,
  phi: Math.PI / 6,
  radius: 100,
  dragging: false,
  lastX: 0,
  lastY: 0
};

function updateCamera() {
  camera.position.x = controls.radius * Math.sin(controls.phi) * Math.cos(controls.theta);
  camera.position.y = controls.radius * Math.cos(controls.phi);
  camera.position.z = controls.radius * Math.sin(controls.phi) * Math.sin(controls.theta);
  camera.lookAt(0, 0, 0);
}

// Mouse/touch events
renderer.domElement.addEventListener('mousedown', e => {
  controls.dragging = true;
  controls.lastX = e.clientX;
  controls.lastY = e.clientY;
});

renderer.domElement.addEventListener('mousemove', e => {
  if (controls.dragging) {
    const dx = e.clientX - controls.lastX;
    const dy = e.clientY - controls.lastY;
    controls.lastX = e.clientX;
    controls.lastY = e.clientY;
    controls.theta -= dx * 0.005;
    controls.phi = Math.max(0.1, Math.min(Math.PI / 2 - 0.1, controls.phi - dy * 0.005));
    updateCamera();
  }
});

renderer.domElement.addEventListener('mouseup', () => controls.dragging = false);

renderer.domElement.addEventListener('wheel', e => {
  controls.radius = Math.max(20, Math.min(500, controls.radius + e.deltaY * 0.1));
  updateCamera();
  e.preventDefault();
}, { passive: false });

// Click to add drops
renderer.domElement.addEventListener('click', e => {
  if (!controls.dragging) {
    const rect = renderer.domElement.getBoundingClientRect();
    const x = (e.clientX - rect.left) / rect.width;
    const y = (e.clientY - rect.top) / rect.height;
    
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2(x * 2 - 1, -(y * 2 - 1));
    raycaster.setFromCamera(mouse, camera);
    
    const intersects = raycaster.intersectObject(water);
    if (intersects.length > 0) {
      const point = intersects[0].point;
      const uvX = (point.x + 50) / 100;
      const uvZ = (point.z + 50) / 100;
      addWaveAt(uvX, uvZ, 0.5);
    }
  }
});

// Touch controls
let touchDist = 0;
renderer.domElement.addEventListener('touchstart', e => {
  if (e.touches.length === 1) {
    controls.dragging = true;
    controls.lastX = e.touches[0].clientX;
    controls.lastY = e.touches[0].clientY;
  } else if (e.touches.length === 2) {
    controls.dragging = false;
    touchDist = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY
    );
  }
});

renderer.domElement.addEventListener('touchmove', e => {
  e.preventDefault();
  if (e.touches.length === 1 && controls.dragging) {
    const dx = e.touches[0].clientX - controls.lastX;
    const dy = e.touches[0].clientY - controls.lastY;
    controls.lastX = e.touches[0].clientX;
    controls.lastY = e.touches[0].clientY;
    controls.theta -= dx * 0.005;
    controls.phi = Math.max(0.1, Math.min(Math.PI / 2 - 0.1, controls.phi - dy * 0.005));
    updateCamera();
  } else if (e.touches.length === 2) {
    const newDist = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY
    );
    controls.radius = Math.max(20, Math.min(500, controls.radius * (touchDist / newDist)));
    touchDist = newDist;
    updateCamera();
  }
}, { passive: false });

renderer.domElement.addEventListener('touchend', () => controls.dragging = false);

// UI controls
document.getElementById('windStrength').addEventListener('input', e => {
  windStrength = parseFloat(e.target.value);
  document.getElementById('windStrength_v').textContent = e.target.value;
});

document.getElementById('windAngle').addEventListener('input', e => {
  windAngle = parseFloat(e.target.value) * Math.PI / 180;
  document.getElementById('windAngle_v').textContent = e.target.value + '°';
});

document.getElementById('waveScale').addEventListener('input', e => {
  waveScale = parseFloat(e.target.value);
  waterMat.uniforms.uWaveScale.value = waveScale;
  document.getElementById('waveScale_v').textContent = e.target.value;
});

document.getElementById('addDrop').addEventListener('click', () => {
  addWaveAt(Math.random(), Math.random(), 0.5);
});

document.getElementById('clearWaves').addEventListener('click', () => {
  h0.fill(0);
  h1.fill(0);
  h2.fill(0);
});

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// === ANIMATION LOOP ===
let lastTime = performance.now();
let frameCount = 0;
let fpsTime = lastTime;

function animate() {
  requestAnimationFrame(animate);
  
  const now = performance.now();
  const dt = Math.min((now - lastTime) / 1000, 0.033);
  lastTime = now;
  
  // Random wind ripples
  if (windStrength > 1.0 && now - lastRippleTime > 800) {
    const numRipples = Math.floor(Math.random() * 2) + 1;
    for (let i = 0; i < numRipples; i++) {
      addWaveAt(Math.random(), Math.random(), 0.1 + Math.random() * 0.1);
    }
    lastRippleTime = now;
  }
  
  // Run simulation
  stepSimulation(dt);
  updateTexture();
  
  // Render
  renderer.render(scene, camera);
  
  // FPS
  frameCount++;
  if (now - fpsTime > 1000) {
    document.getElementById('fps').textContent = frameCount;
    frameCount = 0;
    fpsTime = now;
  }
}

updateCamera();
animate();
</script>
</body>
</html>
