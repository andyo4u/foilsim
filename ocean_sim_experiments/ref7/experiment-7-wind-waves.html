<!-- This is just a smoothing 'compute shader' for using manually: -->
<script id="smoothFragmentShader" type="x-shader/x-fragment">

uniform sampler2D smoothTexture;

void main()	{

  vec2 cellSize = 1.0 / resolution.xy;

  vec2 uv = gl_FragCoord.xy * cellSize;

  // Computes the mean of texel and 4 neighbours
  vec4 textureValue = texture2D( smoothTexture, uv );
  textureValue += texture2D( smoothTexture, uv + vec2( 0.0, cellSize.y ) );
  textureValue += texture2D( smoothTexture, uv + vec2( 0.0, - cellSize.y ) );
  textureValue += texture2D( smoothTexture, uv + vec2( cellSize.x, 0.0 ) );
  textureValue += texture2D( smoothTexture, uv + vec2( - cellSize.x, 0.0 ) );

  textureValue /= 5.0;

  gl_FragColor = textureValue;

}

</script>

<!-- This is a 'compute shader' to read the current level and normal of water at a point -->
<!-- It is used with a variable of size 1x1 -->
<script id="readWaterLevelFragmentShader" type="x-shader/x-fragment">

uniform vec2 point1;

uniform sampler2D levelTexture;

// Integer to float conversion from https://stackoverflow.com/questions/17981163/webgl-read-pixels-from-floating-point-render-target

float shift_right( float v, float amt ) {

  v = floor( v ) + 0.5;
  return floor( v / exp2( amt ) );

}

float shift_left( float v, float amt ) {

  return floor( v * exp2( amt ) + 0.5 );

}

float mask_last( float v, float bits ) {

  return mod( v, shift_left( 1.0, bits ) );

}

float extract_bits( float num, float from, float to ) {

  from = floor( from + 0.5 ); to = floor( to + 0.5 );
  return mask_last( shift_right( num, from ), to - from );

}

vec4 encode_float( float val ) {
  if ( val == 0.0 ) return vec4( 0, 0, 0, 0 );
  float sign = val > 0.0 ? 0.0 : 1.0;
  val = abs( val );
  float exponent = floor( log2( val ) );
  float biased_exponent = exponent + 127.0;
  float fraction = ( ( val / exp2( exponent ) ) - 1.0 ) * 8388608.0;
  float t = biased_exponent / 2.0;
  float last_bit_of_biased_exponent = fract( t ) * 2.0;
  float remaining_bits_of_biased_exponent = floor( t );
  float byte4 = extract_bits( fraction, 0.0, 8.0 ) / 255.0;
  float byte3 = extract_bits( fraction, 8.0, 16.0 ) / 255.0;
  float byte2 = ( last_bit_of_biased_exponent * 128.0 + extract_bits( fraction, 16.0, 23.0 ) ) / 255.0;
  float byte1 = ( sign * 128.0 + remaining_bits_of_biased_exponent ) / 255.0;
  return vec4( byte4, byte3, byte2, byte1 );
}

void main()	{

  vec2 cellSize = 1.0 / resolution.xy;
  float waterLevel = texture2D( levelTexture, point1 ).x;

  vec2 normal = vec2(
    ( texture2D( levelTexture, point1 + vec2( - cellSize.x, 0 ) ).x - texture2D( levelTexture, point1 + vec2( cellSize.x, 0 ) ).x ) * WIDTH / BOUNDS,
    ( texture2D( levelTexture, point1 + vec2( 0, - cellSize.y ) ).x - texture2D( levelTexture, point1 + vec2( 0, cellSize.y ) ).x ) * WIDTH / BOUNDS );


  if ( gl_FragCoord.x < 1.5 ) {

    gl_FragColor = encode_float( waterLevel );

  } else if ( gl_FragCoord.x < 2.5 ) {

    gl_FragColor = encode_float( normal.x );

  } else if ( gl_FragCoord.x < 3.5 ) {

    gl_FragColor = encode_float( normal.y );

  } else {

    gl_FragColor = encode_float( 0.0 );

  }

}

</script>

<script type="module">

import * as THREE from 'three';

// Water size in system units
const BOUNDS = 6;
const BOUNDS_HALF = BOUNDS * 0.5;

let tmpHeightmap = null;
const tmpQuat = new THREE.Quaternion();
const tmpQuatX = new THREE.Quaternion();
const tmpQuatZ = new THREE.Quaternion();
let duckModel = null;

let container, stats;
let camera, scene, renderer, controls;
let mousedown = false;
const mouseCoords = new THREE.Vector2();
const raycaster = new THREE.Raycaster();

let sun;
let waterMesh;
let poolBorder;
let meshRay;
let gpuCompute;
let heightmapVariable;
// let smoothShader;
let readWaterLevelShader;
let readWaterLevelRenderTarget;
let readWaterLevelImage;
const waterNormal = new THREE.Vector3();

const NUM_DUCK = 1; // Single duck in center
const ducks = [];
let ducksEnabled = true;

const simplex = new SimplexNoise();

let frame = 0;

// Wind system variables
let windTime = 0;
let gustPhase = 0;

// Track wind strength changes for buildup timing

let prevWind2Strength = 0;

let wind2BuildupStart = 0;

  viscosity: 0.95, // Reduced slightly to maintain wave energy for visible reflection

    heightmapVariable.material.uniforms[ 'windDirection' ].value.set( windDirX, windDirY );

  windFolder.add( presets, 'calm' ).name( '☁️ Calm (0)' );
  windFolder.add( presets, 'lightBreeze' ).name( '🍃 Light Breeze (2)' );
  windFolder.add( presets, 'moderateBreeze' ).name( '🌬️ Moderate (4)' );
  windFolder.add( presets, 'freshWind' ).name( '💨 Fresh Wind (6)' );
  windFolder.add( presets, 'gale' ).name( '🌪️ Gale (8)' );

function initWater() {

  const geometry = new THREE.PlaneGeometry( BOUNDS, BOUNDS, WIDTH - 1, WIDTH - 1 );

  const material = new WaterMaterial( {
    color: 0x156b8f, // Deeper ocean blue
    metalness: 0.02, // Less metallic for more realistic water
    roughness: 0.1, // Slight roughness for micro-surface detail
    transparent: true,
    opacity: 0.95, // More opaque for depth
    side: THREE.DoubleSide,
    envMapIntensity: 0.8, // Environment reflection
    normalScale: new THREE.Vector2( 1.5, 1.5 ) // Enhanced normals
  } );

  waterMesh = new THREE.Mesh( geometry, material );
  waterMesh.rotation.x = - Math.PI * 0.5;
  waterMesh.matrixAutoUpdate = false;
  waterMesh.updateMatrix();

  waterMesh.receiveShadow = true;
  waterMesh.castShadow = true;

  scene.add( waterMesh );

  // No wall - open ocean on all sides
  // poolBorder removed for open ocean simulation

  // THREE.Mesh just for mouse raycasting
  const geometryRay = new THREE.PlaneGeometry( BOUNDS, BOUNDS, 1, 1 );
  meshRay = new THREE.Mesh( geometryRay, new THREE.MeshBasicMaterial( { color: 0xFFFFFF, visible: false } ) );
  meshRay.rotation.x = - Math.PI / 2;
  meshRay.matrixAutoUpdate = false;
  meshRay.updateMatrix();
  scene.add( meshRay );


  // Creates the gpu computation class and sets it up

  gpuCompute = new GPUComputationRenderer( WIDTH, WIDTH, renderer );

  const heightmap0 = gpuCompute.createTexture();

  fillTexture( heightmap0 );

  heightmapVariable = gpuCompute.addVariable( 'heightmap', shaderChange.heightmap_frag, heightmap0 );

  gpuCompute.setVariableDependencies( heightmapVariable, [ heightmapVariable ] );

  heightmapVariable.material.uniforms[ 'mousePos' ] = { value: new THREE.Vector2( 10000, 10000 ) };
  heightmapVariable.material.uniforms[ 'mouseSize' ] = { value: 0.2 };
  heightmapVariable.material.uniforms[ 'viscosity' ] = { value: 0.93 };
  heightmapVariable.material.uniforms[ 'deep' ] = { value: 0.01 };
  
  // Wind 1 uniforms
  heightmapVariable.material.uniforms[ 'windDirection' ] = { value: new THREE.Vector2( 1, 0 ) };
  heightmapVariable.material.uniforms[ 'windStrength' ] = { value: 0.0 };
  heightmapVariable.material.uniforms[ 'windGust' ] = { value: 0.0 };
  heightmapVariable.material.uniforms[ 'windTime' ] = { value: 0.0 };
  heightmapVariable.material.uniforms[ 'wind1BuildupStart' ] = { value: 0.0 };
  
  // Wind 2 uniforms (independent second wind source)
  heightmapVariable.material.uniforms[ 'wind2Direction' ] = { value: new THREE.Vector2( 0.707, -0.707 ) }; // 315°
  heightmapVariable.material.uniforms[ 'wind2Strength' ] = { value: 0.0 };
  heightmapVariable.material.uniforms[ 'wind2Gust' ] = { value: 0.0 };
  heightmapVariable.material.uniforms[ 'wind2BuildupStart' ] = { value: 0.0 };
  
  // Wave offset to follow duck
  heightmapVariable.material.uniforms[ 'waveOffset' ] = { value: new THREE.Vector2( 0, 0 ) };
  
  heightmapVariable.material.defines.BOUNDS = BOUNDS.toFixed( 1 );

  const error = gpuCompute.init();
  if ( error !== null ) console.error( error );

  // Create compute shader to smooth the water surface and velocity
  //smoothShader = gpuCompute.createShaderMaterial( document.getElementById( 'smoothFragmentShader' ).textContent, { smoothTexture: { value: null } } );

  // Create compute shader to read water level
  readWaterLevelShader = gpuCompute.createShaderMaterial( document.getElementById( 'readWaterLevelFragmentShader' ).textContent, {
    point1: { value: new THREE.Vector2() },
    levelTexture: { value: null }
  } );
  readWaterLevelShader.defines.WIDTH = WIDTH.toFixed( 1 );
  readWaterLevelShader.defines.BOUNDS = BOUNDS.toFixed( 1 );

  // Create a 4x1 pixel image and a render target (Uint8, 4 channels, 1 byte per channel) to read water height and orientation
  readWaterLevelImage = new Uint8Array( 4 * 1 * 4 );

  readWaterLevelRenderTarget = new THREE.WebGLRenderTarget( 4, 1, {
    wrapS: THREE.ClampToEdgeWrapping,
    wrapT: THREE.ClampToEdgeWrapping,
    minFilter: THREE.NearestFilter,
    magFilter: THREE.NearestFilter,
    format: THREE.RGBAFormat,
    type: THREE.UnsignedByteType,
    depthBuffer: false
  } );

}

function fillTexture( texture ) {

  const waterMaxHeight = 0.1;

  function noise( x, y ) {

    let multR = waterMaxHeight;
    let mult = 0.025;
    let r = 0;
    for ( let i = 0; i < 15; i ++ ) {

      r += multR * simplex.noise( x * mult, y * mult );
      multR *= 0.53 + 0.025 * i;
      mult *= 1.25;

    }

    return r;

  }

  const pixels = texture.image.data;

  let p = 0;
  for ( let j = 0; j < WIDTH; j ++ ) {

    for ( let i = 0; i < WIDTH; i ++ ) {

      const x = i * 128 / WIDTH;
      const y = j * 128 / WIDTH;

      pixels[ p + 0 ] = noise( x, y );
      pixels[ p + 1 ] = pixels[ p + 0 ];
      pixels[ p + 2 ] = 0;
      pixels[ p + 3 ] = 1;

      p += 4;

    }

  }

}

function addShadow( v ) {

  renderer.shadowMap.enabled = v;
  sun.castShadow = v;

  if ( v ) {

    renderer.shadowMap.type = THREE.VSMShadowMap;
    const shadow = sun.shadow;
    shadow.mapSize.width = shadow.mapSize.height = 2048;
    shadow.radius = 2;
    shadow.bias = - 0.0005;
    const shadowCam = shadow.camera, s = 5;
    shadowCam.near = 0.1;
    shadowCam.far = 6;
    shadowCam.right = shadowCam.top	= s;
    shadowCam.left = shadowCam.bottom = - s;

  } else {

    if ( sun.shadow ) sun.shadow.dispose();

  }

  // debug shadow
  //scene.add(  new THREE.CameraHelper(shadowCam) );

}

function createducks() {

  for ( let i = 0; i < NUM_DUCK; i ++ ) {

    let sphere = duckModel;
    if ( i < NUM_DUCK - 1 ) {

      sphere = duckModel.clone();

    }

    // Place duck at center
    sphere.position.x = 0;
    sphere.position.z = 0;

    sphere.userData.velocity = new THREE.Vector3();

    scene.add( sphere );

    ducks[ i ] = sphere;

  }

}

function duckDynamics() {

  readWaterLevelShader.uniforms[ 'levelTexture' ].value = tmpHeightmap;

  for ( let i = 0; i < NUM_DUCK; i ++ ) {

    const sphere = ducks[ i ];

    if ( sphere ) {

      // Read water level and orientation
      const u = 0.5 * sphere.position.x / BOUNDS_HALF + 0.5;
      const v = 1 - ( 0.5 * sphere.position.z / BOUNDS_HALF + 0.5 );
      readWaterLevelShader.uniforms[ 'point1' ].value.set( u, v );
      gpuCompute.doRenderTarget( readWaterLevelShader, readWaterLevelRenderTarget );

      renderer.readRenderTargetPixels( readWaterLevelRenderTarget, 0, 0, 4, 1, readWaterLevelImage );
      const pixels = new Float32Array( readWaterLevelImage.buffer );

      // Get orientation
      waterNormal.set( pixels[ 1 ], 0, - pixels[ 2 ] );

      const pos = sphere.position;

      const startPos = pos.clone();

      // Set height
      pos.y = pixels[ 0 ];

      // Move sphere (accumulate drift)
      waterNormal.multiplyScalar( 0.01 );
      sphere.userData.velocity.add( waterNormal );
      sphere.userData.velocity.multiplyScalar( 0.998 );
      
      // Track drift for wave offset (keep duck at center)
      const driftX = sphere.userData.velocity.x;
      const driftZ = sphere.userData.velocity.z;
      duckDriftX += driftX;
      duckDriftZ += driftZ;
      
      // Keep duck at center (0, 0) - don't actually move it
      // pos.add( sphere.userData.velocity );
      pos.x = 0;
      pos.z = 0;

      // No boundary checks needed - duck stays at center
      // Wave simulation shifts instead

      // duck orientation test

      const startNormal = new THREE.Vector3( pixels[ 1 ], 1, - pixels[ 2 ] ).normalize();

      const dir = startPos.sub( pos );
      dir.y = 0;
      dir.normalize();

      const yAxis = new THREE.Vector3( 0, 1, 0 );
      const zAxis = new THREE.Vector3( 0, 0, - 1 );
      tmpQuatX.setFromUnitVectors( zAxis, dir );
      tmpQuatZ.setFromUnitVectors( yAxis, startNormal );
      tmpQuat.multiplyQuaternions( tmpQuatZ, tmpQuatX );
      sphere.quaternion.slerp( tmpQuat, 0.017 );

    }

  }

}

function onWindowResize() {

  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();

  renderer.setSize( window.innerWidth, window.innerHeight );

}

function onPointerDown() {

  mousedown = true;

}

function onPointerUp() {

  mousedown = false;
  controls.enabled = true;

}

function onPointerMove( event ) {

  const dom = renderer.domElement;
  mouseCoords.set( ( event.clientX / dom.clientWidth ) * 2 - 1, - ( event.clientY / dom.clientHeight ) * 2 + 1 );

}

function raycast() {

  // Mouse interaction disabled - no water disturbance on click
  // Always set mousePos far away so mouse only controls camera
  const uniforms = heightmapVariable.material.uniforms;
  uniforms[ 'mousePos' ].value.set( 10000, 10000 );
  
  // Keep orbit controls enabled for camera movement

}

function animate() {

  render();
  stats.update();

}

function render() {

  raycast();

  frame ++;
  
  // Update wind time for shader animation
  windTime += 0.016;
  if ( heightmapVariable ) {
    heightmapVariable.material.uniforms[ 'windTime' ].value = windTime;
    
    // Detect wind strength changes and reset buildup timer
    if ( effectController.windStrength !== prevWind1Strength ) {
      wind1BuildupStart = windTime;
      prevWind1Strength = effectController.windStrength;
      heightmapVariable.material.uniforms[ 'wind1BuildupStart' ].value = wind1BuildupStart;
    }
    
    if ( effectController.wind2Strength !== prevWind2Strength ) {
      wind2BuildupStart = windTime;
      prevWind2Strength = effectController.wind2Strength;
      heightmapVariable.material.uniforms[ 'wind2BuildupStart' ].value = wind2BuildupStart;
    }
  }
  
  // Random ripple spawning disabled - causes noise and grid artifacts

  if ( frame >= 7 - effectController.speed ) {

    // Do the gpu computation
    gpuCompute.compute();
    tmpHeightmap = gpuCompute.getCurrentRenderTarget( heightmapVariable ).texture;

    if ( ducksEnabled ) {
      duckDynamics();
      
      // Update wave offset to follow duck drift
      // Convert world space drift to UV space (normalized 0-1)
      const offsetX = duckDriftX / BOUNDS;
      const offsetZ = duckDriftZ / BOUNDS;
      heightmapVariable.material.uniforms[ 'waveOffset' ].value.set( offsetX, offsetZ );
    }

    // Get compute output in custom uniform
    if ( waterMesh ) waterMesh.material.heightmap = tmpHeightmap;

    frame = 0;

  }

  // Render
  renderer.render( scene, camera );

}

class WaterMaterial extends THREE.MeshStandardMaterial {

  constructor( parameters ) {

    super();

    this.defines = {

      'STANDARD': '',
      'USE_UV': '',
      'WIDTH': WIDTH.toFixed( 1 ),
      'BOUNDS': BOUNDS.toFixed( 1 ),

    };

    this.extra = {};

    this.addParameter( 'heightmap', null );

    this.setValues( parameters );

  }

  addParameter( name, value ) {

    this.extra[ name ] = value;
    Object.defineProperty( this, name, {
      get: () => ( this.extra[ name ] ),
      set: ( v ) => {

        this.extra[ name ] = v;
        if ( this.userData.shader ) this.userData.shader.uniforms[ name ].value = this.extra[ name ];

      }
    } );

  }

  onBeforeCompile( shader ) {

    for ( const name in this.extra ) {

      shader.uniforms[ name ] = { value: this.extra[ name ] };

    }

    shader.vertexShader = shader.vertexShader.replace( '#include <common>', shaderChange.common );
    //shader.vertexShader = 'uniform sampler2D heightmap;\n' + shader.vertexShader;
    shader.vertexShader = shader.vertexShader.replace( '#include <beginnormal_vertex>', shaderChange.beginnormal_vertex );
    shader.vertexShader = shader.vertexShader.replace( '#include <begin_vertex>', shaderChange.begin_vertex );

    this.userData.shader = shader;

  }

}


const shaderChange = {

  heightmap_frag: /* glsl */`
  #include <common>

  uniform vec2 mousePos;
  uniform float mouseSize;
  uniform float viscosity;
  uniform float deep;
  
  // Wind 1 uniforms
  uniform vec2 windDirection;
  uniform float windStrength;
  uniform float windGust;
  uniform float windTime;
  uniform float wind1BuildupStart; // When wind 1 strength last changed
  
  // Wind 2 uniforms (independent second wind source)
  uniform vec2 wind2Direction;
  uniform float wind2Strength;
  uniform float wind2Gust;
  uniform float wind2BuildupStart; // When wind 2 strength last changed
  
  // Wave offset to follow duck drift
  uniform vec2 waveOffset;

  void main()	{

    vec2 cellSize = 1.0 / resolution.xy;

    vec2 uv = gl_FragCoord.xy * cellSize;

    // heightmapValue.x == height from previous frame
    // heightmapValue.y == height from penultimate frame
    vec4 heightmapValue = texture2D( heightmap, uv );

    // Get neighbours
    vec4 north = texture2D( heightmap, uv + vec2( 0.0, cellSize.y ) );
    vec4 south = texture2D( heightmap, uv + vec2( 0.0, - cellSize.y ) );
    vec4 east = texture2D( heightmap, uv + vec2( cellSize.x, 0.0 ) );
    vec4 west = texture2D( heightmap, uv + vec2( - cellSize.x, 0.0 ) );

    // No boundary reflection - open ocean on all sides
    
    // Wave equation
    float newHeight = ( ( north.x + south.x + east.x + west.x ) * 0.5 - (heightmapValue.y) ) * viscosity;

    // WIND 1: Clean directional wind waves
    if ( windStrength > 0.1 ) {
      vec2 posFromCenter = uv - vec2( 0.5 ) + waveOffset; // Offset to follow duck
      float distAlongWind = dot( posFromCenter, -windDirection );
      
      float waveSpeed = 2.0;
      float wave1 = sin( distAlongWind * 12.0 * 3.14159 - windTime * waveSpeed );
      float wave2 = sin( distAlongWind * 8.0 * 3.14159 - windTime * waveSpeed * 0.8 ) * 0.7;
      float wave3 = sin( distAlongWind * 5.0 * 3.14159 - windTime * waveSpeed * 0.6 ) * 0.5;
      float combinedWave = ( wave1 + wave2 + wave3 ) / 2.2;
      
      // 10 second buildup (from when wind strength last changed)
      float elapsedTime = windTime - wind1BuildupStart;
      float buildupTime = min( elapsedTime * 0.1, 1.0 );
      
      float windForce = windStrength * combinedWave * 0.008 * buildupTime;
      
      if ( windGust > 0.5 ) {
        float gustFactor = 1.0 + 0.3 * sin( windTime * 0.5 ) * sin( windTime * 0.7 );
        windForce *= gustFactor;
      }
      
      newHeight += windForce;
    }
    
    // WIND 2: Independent second wind source from different direction
    if ( wind2Strength > 0.1 ) {
      vec2 posFromCenter = uv - vec2( 0.5 ) + waveOffset; // Offset to follow duck
      float distAlongWind2 = dot( posFromCenter, -wind2Direction );
      
      float waveSpeed2 = 2.2; // Slightly different speed
      float wave1_2 = sin( distAlongWind2 * 10.0 * 3.14159 - windTime * waveSpeed2 );
      float wave2_2 = sin( distAlongWind2 * 7.0 * 3.14159 - windTime * waveSpeed2 * 0.85 ) * 0.6;
      float wave3_2 = sin( distAlongWind2 * 4.5 * 3.14159 - windTime * waveSpeed2 * 0.7 ) * 0.4;
      float combinedWave2 = ( wave1_2 + wave2_2 + wave3_2 ) / 2.0;
      
      // Same 10 second buildup (from when wind strength last changed)
      float elapsedTime2 = windTime - wind2BuildupStart;
      float buildupTime2 = min( elapsedTime2 * 0.1, 1.0 );
      
      float wind2Force = wind2Strength * combinedWave2 * 0.008 * buildupTime2;
      
      if ( wind2Gust > 0.5 ) {
        float gust2Factor = 1.0 + 0.3 * sin( windTime * 0.6 ) * sin( windTime * 0.8 );
        wind2Force *= gust2Factor;
      }
      
      newHeight += wind2Force;
    }

    // Continuous ambient turbulence (like initial simplex noise, but ongoing)
    // Multiple scales of noise for natural appearance
    float turbNoise1 = sin( uv.x * 50.0 + windTime * 0.3 ) * cos( uv.y * 50.0 + windTime * 0.4 );
    float turbNoise2 = sin( uv.x * 80.0 - windTime * 0.5 ) * cos( uv.y * 80.0 + windTime * 0.35 ) * 0.6;
    float turbNoise3 = sin( uv.x * 120.0 + windTime * 0.25 ) * cos( uv.y * 120.0 - windTime * 0.3 ) * 0.4;
    float turbNoise4 = sin( uv.x * 200.0 + windTime * 0.15 ) * cos( uv.y * 200.0 + windTime * 0.2 ) * 0.2;
    
    float combinedTurbulence = ( turbNoise1 + turbNoise2 + turbNoise3 + turbNoise4 ) / 2.2;
    
    // Very subtle - just keeps surface alive like initial state
    newHeight += combinedTurbulence * 0.0003;

    // Mouse influence
    float mousePhase = clamp( length( ( uv - vec2( 0.5 ) ) * BOUNDS - vec2( mousePos.x, - mousePos.y ) ) * PI / mouseSize, 0.0, PI );
    newHeight -= ( cos( mousePhase ) + 1.0 ) * deep;

    // Wave height limiter - accounts for both wind sources
    float totalWindStrength = windStrength + wind2Strength;
    float maxWaveHeight = 0.25 + totalWindStrength * 0.05;
    newHeight = clamp( newHeight, -maxWaveHeight, maxWaveHeight );

    heightmapValue.y = heightmapValue.x;
    heightmapValue.x = newHeight;

    gl_FragColor = heightmapValue;

  }
  `,
  // FOR MATERIAL
  common: /* glsl */`
  #include <common>
  uniform sampler2D heightmap;
  `,
  beginnormal_vertex: /* glsl */`
  vec2 cellSize = vec2( 1.0 / WIDTH, 1.0 / WIDTH );
  
  // Sample heightmap with 3x3 neighborhood for better normals
  float hL = texture2D( heightmap, uv + vec2( -cellSize.x, 0 ) ).x;
  float hR = texture2D( heightmap, uv + vec2( cellSize.x, 0 ) ).x;
  float hD = texture2D( heightmap, uv + vec2( 0, -cellSize.y ) ).x;
  float hU = texture2D( heightmap, uv + vec2( 0, cellSize.y ) ).x;
  
  // Enhanced normal with stronger height influence
  vec3 objectNormal = normalize( vec3(
    ( hL - hR ) * WIDTH / BOUNDS * 2.0,
    ( hD - hU ) * WIDTH / BOUNDS * 2.0,
    1.0
  ) );
  
  // Add micro-detail to normals (subtle high-frequency variation)
  float microDetail = fract( sin( dot( uv * 200.0, vec2( 12.9898, 78.233 ) ) ) * 43758.5453 ) * 0.05;
  objectNormal.xy += vec2( microDetail );
  objectNormal = normalize( objectNormal );
  
  #ifdef USE_TANGENT
    vec3 objectTangent = vec3( tangent.xyz );
  #endif
  `,
  begin_vertex: /* glsl */`
  float heightValue = texture2D( heightmap, uv ).x;
  vec3 transformed = vec3( position.x, position.y, heightValue );
  #ifdef USE_ALPHAHASH
    vPosition = vec3( position );
  #endif
  `,
  color_fragment: /* glsl */`
  #if defined( USE_COLOR_ALPHA )
    diffuseColor *= vColor;
  #elif defined( USE_COLOR )
    diffuseColor.rgb *= vColor;
  #endif
  
  // Add foam on wave crests and steep slopes
  vec2 cellSize = vec2( 1.0 / WIDTH, 1.0 / WIDTH );
  float h = texture2D( heightmap, vUv ).x;
  float hL = texture2D( heightmap, vUv + vec2( -cellSize.x, 0.0 ) ).x;
  float hR = texture2D( heightmap, vUv + vec2( cellSize.x, 0.0 ) ).x;
  float hD = texture2D( heightmap, vUv + vec2( 0.0, -cellSize.y ) ).x;
  float hU = texture2D( heightmap, vUv + vec2( 0.0, cellSize.y ) ).x;
  
  // Calculate slope (wave steepness)
  float slopeX = abs( hR - hL );
  float slopeY = abs( hU - hD );
  float slope = sqrt( slopeX * slopeX + slopeY * slopeY ) * 10.0;
  
  // Foam on wave crests (high points with steep slopes)
  float crestFactor = smoothstep( 0.15, 0.3, h ) * smoothstep( 0.3, 0.6, slope );
  vec3 foamColor = vec3( 0.95, 0.98, 1.0 ); // White-blue foam
  
  // Depth-based color variation
  float depth = smoothstep( -0.2, 0.1, h );
  vec3 deepColor = vec3( 0.02, 0.15, 0.25 ); // Deep ocean blue
  vec3 shallowColor = vec3( 0.08, 0.35, 0.5 ); // Lighter blue
  vec3 depthColor = mix( deepColor, shallowColor, depth );
  
  // Combine: base color tinted by depth, with foam on crests
  diffuseColor.rgb = mix( diffuseColor.rgb * depthColor, foamColor, crestFactor );
  
  // Add subtle sparkle variation (sunlight glints)
  float sparkle = fract( sin( dot( vUv * 100.0, vec2( 12.9898, 78.233 ) ) ) * 43758.5453 );
  sparkle = smoothstep( 0.95, 1.0, sparkle ) * 0.3 * smoothstep( 0.1, 0.3, slope );
  diffuseColor.rgb += vec3( sparkle );
  `,
};

</script>
