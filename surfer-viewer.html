<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Surfer + Board Viewer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { overflow: hidden; background: #0a1628; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: #c8d6e5; }
  canvas { display: block; }

  /* ── Splash overlay ── */
  #splash {
    position: fixed; inset: 0; z-index: 100;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
    padding-bottom: 12vh;
    background: linear-gradient(180deg, rgba(10,22,40,0) 40%, rgba(10,22,40,0.85) 100%);
    pointer-events: none; transition: opacity 0.8s ease;
  }
  #splash.hidden { opacity: 0; pointer-events: none; }
  #splash h1 { font-size: 36px; color: #fff; margin-bottom: 6px; font-weight: 700; letter-spacing: 1px; text-shadow: 0 2px 20px rgba(0,0,0,0.7); }
  #splash p { font-size: 14px; color: #8ab8d8; margin-bottom: 24px; text-shadow: 0 1px 8px rgba(0,0,0,0.6); }
  #splash button {
    pointer-events: auto; padding: 14px 36px; font-size: 15px; font-weight: 600;
    background: rgba(74,170,255,0.25); border: 2px solid rgba(100,180,255,0.5);
    color: #fff; border-radius: 10px; cursor: pointer; backdrop-filter: blur(8px);
    transition: all 0.3s; letter-spacing: 0.5px;
  }
  #splash button:hover { background: rgba(74,170,255,0.45); border-color: rgba(140,210,255,0.8); transform: scale(1.04); }
  #loading { font-size: 13px; color: #5ea8d8; margin-bottom: 16px; }

  /* ── Panel (board mode) ── */
  #panel {
    position: fixed; top: 16px; right: 16px; z-index: 10;
    width: 280px; background: rgba(8, 18, 38, 0.92);
    border: 1px solid rgba(100, 180, 255, 0.15);
    border-radius: 10px; padding: 14px 18px;
    backdrop-filter: blur(12px);
    max-height: calc(100vh - 32px); overflow-y: auto;
    display: none;
  }
  #panel h2 { font-size: 13px; color: #7cc4f5; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.8px; font-weight: 600; }
  .row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 7px; font-size: 11px; color: #8ab8d8; }
  .row label { flex: 0 0 90px; }
  .row input[type=range] { flex: 1; accent-color: #4af; height: 3px; }
  .row .val { flex: 0 0 48px; text-align: right; font-family: monospace; color: #5ea8d8; }
  .section { border-top: 1px solid rgba(100,180,255,0.1); margin-top: 12px; padding-top: 12px; }
  .section:first-child { border: none; margin: 0; padding: 0; }
  button.sm { background: rgba(74,156,212,0.2); border: 1px solid rgba(74,156,212,0.4); color: #7cc4f5; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 11px; margin-right: 4px; margin-bottom: 4px; }
  button.sm:hover { background: rgba(74,156,212,0.35); }
  button.sm.active { background: rgba(74,156,212,0.5); color: #fff; }
  #info { position: fixed; bottom: 16px; left: 16px; z-index: 10; background: rgba(8,18,38,0.7); padding: 8px 14px; border-radius: 6px; font-size: 11px; font-family: monospace; color: #8ab8d8; display: none; }
  #info span { color: #7cc4f5; }
</style>
</head>
<body>

<!-- Splash overlay -->
<div id="splash">
  <h1>FoilSim</h1>
  <p>Hydrofoil Surfing Simulator</p>
  <div id="loading">Loading character...</div>
  <button id="go-btn" style="display:none;" onclick="enterBoardMode()">Mount the Board</button>
</div>

<!-- Board mode panel -->
<div id="panel">
  <div class="section">
    <h2>Character</h2>
    <div class="row"><label>Visible</label><input type="checkbox" id="charVis" checked style="flex:0;"></div>
    <div class="row"><label>Scale</label><input type="range" id="charScale" min="0.1" max="3" step="0.05" value="1.25"><span class="val" id="charScaleV">1.25</span></div>
    <div class="row"><label>X Offset</label><input type="range" id="charX" min="-2" max="2" step="0.05" value="-0.05"><span class="val" id="charXV">-0.05</span></div>
    <div class="row"><label>Y Offset</label><input type="range" id="charY" min="-1" max="3" step="0.05" value="-0.05"><span class="val" id="charYV">-0.05</span></div>
    <div class="row"><label>Z Offset</label><input type="range" id="charZ" min="-2" max="2" step="0.05" value="0.1"><span class="val" id="charZV">0.10</span></div>
    <div class="row"><label>Rotation Y</label><input type="range" id="charRY" min="-180" max="180" step="1" value="-19"><span class="val" id="charRYV">-19°</span></div>
  </div>

  <div class="section">
    <h2>Animation</h2>
    <div class="row"><label>Play/Pause</label><input type="checkbox" id="animPlay" checked style="flex:0;"></div>
    <div class="row"><label>Speed</label><input type="range" id="animSpeed" min="0.1" max="3" step="0.1" value="1"><span class="val" id="animSpeedV">1.0</span></div>
    <div class="row"><label>Back to Splash</label><button class="sm" onclick="enterSplashMode()">Splash</button></div>
  </div>

  <div class="section">
    <h2>Board</h2>
    <div class="row"><label>Visible</label><input type="checkbox" id="boardVis" checked style="flex:0;"></div>
    <div class="row"><label>Scale</label><input type="range" id="boardScale" min="0.5" max="2" step="0.05" value="1"><span class="val" id="boardScaleV">1.00</span></div>
  </div>

  <div class="section">
    <h2>Scene</h2>
    <div class="row"><label>Background</label>
      <button class="sm" onclick="setBg(0)" class="active">Studio</button>
      <button class="sm" onclick="setBg(1)">Sky</button>
      <button class="sm" onclick="setBg(2)">Dark</button>
    </div>
    <div class="row"><label>Auto Rotate</label><input type="checkbox" id="autoRot" style="flex:0;"></div>
    <div class="row"><label>Show Grid</label><input type="checkbox" id="showGrid" checked style="flex:0;"></div>
    <div class="row"><label>Show Axes</label><input type="checkbox" id="showAxes" style="flex:0;"></div>
  </div>

  <div class="section">
    <h2>Lighting</h2>
    <div class="row"><label>Sun Angle</label><input type="range" id="sunEl" min="5" max="89" step="1" value="45"><span class="val" id="sunElV">45°</span></div>
    <div class="row"><label>Sun Dir</label><input type="range" id="sunAz" min="0" max="360" step="1" value="135"><span class="val" id="sunAzV">135°</span></div>
    <div class="row"><label>Intensity</label><input type="range" id="sunInt" min="0" max="3" step="0.05" value="1.4"><span class="val" id="sunIntV">1.40</span></div>
  </div>
</div>

<div id="info">
  <span>Surfer Viewer</span> · Drag to orbit · Scroll to zoom · Right-drag to pan<br>
  Triangles: <span id="tris">--</span> · Meshes: <span id="meshes">--</span>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/fflate@0.6.10/umd/index.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/FBXLoader.js"></script>
<script>
// ══════════════════════════════════════════════
// SCENE SETUP
// ══════════════════════════════════════════════
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.set(0, 1.2, 4);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const bgColors = [
  new THREE.Color(0.45, 0.52, 0.6),
  new THREE.Color(0.55, 0.75, 0.92),
  new THREE.Color(0.06, 0.08, 0.13),
];
scene.background = bgColors[0];
function setBg(i) {
  scene.background = bgColors[i];
  document.querySelectorAll('.sm').forEach(b => b.classList.remove('active'));
}
window.setBg = setBg;

const grid = new THREE.GridHelper(10, 20, 0x4a7a9e, 0x2a3a5e);
scene.add(grid);
const axes = new THREE.AxesHelper(1.5);
axes.visible = false;
scene.add(axes);

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(20, 20),
  new THREE.ShadowMaterial({ opacity: 0.35 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.01;
ground.receiveShadow = true;
scene.add(ground);

const ambient = new THREE.HemisphereLight(0xffffff, 0x444466, 0.55);
scene.add(ambient);
const sun = new THREE.DirectionalLight(0xffffff, 1.4);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 0.5; sun.shadow.camera.far = 30;
sun.shadow.camera.left = -5; sun.shadow.camera.right = 5;
sun.shadow.camera.top = 5; sun.shadow.camera.bottom = -5;
scene.add(sun);

// ══════════════════════════════════════════════
// BOARD (matches js/foil.js)
// ══════════════════════════════════════════════
const boardMat = new THREE.MeshStandardMaterial({ color: 0xf0f4f8, roughness: 0.4, metalness: 0.05 });
const carbonMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.35, metalness: 0.6 });

function createFoilAsset() {
  const g = new THREE.Group();
  const boardLength = 1.1, bL = boardLength/2, bW = 0.3;
  const shape = new THREE.Shape();
  shape.moveTo(-bL, 0);
  shape.bezierCurveTo(-bL + 0.05, bW * 0.6, -bL + 0.2, bW * 0.95, -bL * 0.3, bW);
  shape.bezierCurveTo(bL * 0.3, bW * 0.95, bL - 0.12, bW * 0.5, bL, 0);
  shape.bezierCurveTo(bL - 0.12, -bW * 0.5, bL * 0.3, -bW * 0.95, -bL * 0.3, -bW);
  shape.bezierCurveTo(-bL + 0.2, -bW * 0.95, -bL + 0.05, -bW * 0.6, -bL, 0);
  const boardGeom = new THREE.ExtrudeGeometry(shape, {
    steps: 1, depth: 0.08, bevelEnabled: true, bevelThickness: 0.02, bevelSize: 0.02, bevelSegments: 3,
  });
  boardGeom.rotateX(-Math.PI/2);
  const board = new THREE.Mesh(boardGeom, boardMat);
  board.position.set(boardLength/6, 0.81, 0);
  board.castShadow = true; board.receiveShadow = true;
  g.add(board);
  const mast = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.85, 0.18), carbonMat);
  mast.position.set(0, 0.4, 0); mast.rotation.y = Math.PI/2; mast.castShadow = true; g.add(mast);
  const fuse = new THREE.Mesh(new THREE.BoxGeometry(0.75, 0.05, 0.05), carbonMat);
  fuse.position.set(-0.125, 0, 0); fuse.castShadow = true; g.add(fuse);
  const fWing = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.02, 1.1), carbonMat);
  fWing.position.set(0.25, 0, 0); fWing.scale.set(1,1,0.8); fWing.castShadow = true; g.add(fWing);
  const bWing = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.02, 0.4), carbonMat);
  bWing.position.set(-0.5, 0, 0); bWing.castShadow = true; g.add(bWing);
  return g;
}

const foilAsset = createFoilAsset();
foilAsset.visible = false; // hidden until board mode
scene.add(foilAsset);

// ══════════════════════════════════════════════
// LOAD ANIMATED CHARACTER (FBX from Mixamo)
// ══════════════════════════════════════════════
let mixer = null;
let currentAction = null;
let charModel = null;
let charContainer = new THREE.Group();
scene.add(charContainer);

const clock = new THREE.Clock();
const loadingEl = document.getElementById('loading');
const goBtn = document.getElementById('go-btn');

// Pre-load the character texture from the original tripo3d export
const charTexture = new THREE.TextureLoader().load('assets/surferintpose_basecolor.JPEG');
charTexture.flipY = false; // FBX UVs typically don't need flip
charTexture.encoding = THREE.sRGBEncoding;

// Load the animated FBX (contains mesh + skeleton + animation)
const fbxLoader = new THREE.FBXLoader();
fbxLoader.load('assets/crouch-turn-left.fbx', (fbx) => {
  charModel = fbx;
  charModel.traverse(o => {
    if (o.isMesh) {
      o.castShadow = true;
      o.receiveShadow = true;
      // Apply the base color texture
      if (o.material) {
        const mats = Array.isArray(o.material) ? o.material : [o.material];
        mats.forEach(m => {
          m.map = charTexture;
          m.needsUpdate = true;
        });
      }
    }
  });

  // Auto-fit: normalize and center
  const box = new THREE.Box3().setFromObject(charModel);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  // Scale to ~1.7m tall
  const targetHeight = 1.7;
  const scale = targetHeight / size.y;
  charModel.scale.setScalar(scale);
  // Recompute box after scale
  const box2 = new THREE.Box3().setFromObject(charModel);
  const center2 = box2.getCenter(new THREE.Vector3());
  charModel.position.set(-center2.x, -box2.min.y, -center2.z);

  charContainer.add(charModel);

  // Setup animation mixer
  mixer = new THREE.AnimationMixer(charModel);
  if (fbx.animations && fbx.animations.length > 0) {
    currentAction = mixer.clipAction(fbx.animations[0]);
    currentAction.play();
  }

  // Stats
  let triCount = 0, meshCount = 0;
  charModel.traverse(o => {
    if (o.isMesh) {
      meshCount++;
      const idx = o.geometry.index;
      triCount += idx ? idx.count / 3 : o.geometry.attributes.position.count / 3;
    }
  });
  document.getElementById('tris').textContent = Math.round(triCount).toLocaleString();
  document.getElementById('meshes').textContent = meshCount;

  // Show button
  loadingEl.textContent = 'Character ready!';
  goBtn.style.display = '';

}, (xhr) => {
  if (xhr.total > 0) {
    const pct = Math.round(xhr.loaded / xhr.total * 100);
    loadingEl.textContent = `Loading character... ${pct}%`;
  }
}, (err) => {
  console.error('Failed to load FBX:', err);
  loadingEl.innerHTML = '<span style="color:#f55">Failed to load character</span>';
});

// ══════════════════════════════════════════════
// MODE SWITCHING
// ══════════════════════════════════════════════
let mode = 'splash'; // 'splash' or 'board'

function enterBoardMode() {
  mode = 'board';
  document.getElementById('splash').classList.add('hidden');
  document.getElementById('panel').style.display = '';
  document.getElementById('info').style.display = '';
  foilAsset.visible = true;

  // Move character onto the board
  charContainer.position.set(0.18 + (-0.05), 0.93 + (-0.05), 0.10);
  charContainer.rotation.y = -19 * Math.PI / 180;
  const s = 1.25;
  // Recompute scale (base normalized scale * board scale)
  if (charModel) {
    const box = new THREE.Box3().setFromObject(charModel);
    const size = box.getSize(new THREE.Vector3());
  }
  charContainer.scale.setScalar(s);

  // Camera to board view
  camR = 5.5;
  camTheta = Math.atan2(4, 3);
  camPhi = Math.acos(2.5 / camR);
  target.set(0, 1.0, 0);
  syncFromUI();
}
window.enterBoardMode = enterBoardMode;

function enterSplashMode() {
  mode = 'splash';
  document.getElementById('splash').classList.remove('hidden');
  document.getElementById('panel').style.display = 'none';
  document.getElementById('info').style.display = 'none';
  foilAsset.visible = false;

  // Center character for splash
  charContainer.position.set(0, 0, 0);
  charContainer.rotation.y = 0;
  charContainer.scale.setScalar(1);

  // Camera for splash — character centered
  camR = 4;
  camTheta = 0.5;
  camPhi = 1.2;
  target.set(0, 0.85, 0);
  autoRotate = true;
  document.getElementById('autoRot').checked = true;
}
window.enterSplashMode = enterSplashMode;

// ══════════════════════════════════════════════
// UI BINDINGS
// ══════════════════════════════════════════════
function bind(id, valId, fn, fmt) {
  const el = document.getElementById(id);
  const valEl = valId ? document.getElementById(valId) : null;
  el.addEventListener('input', () => {
    const v = el.type === 'checkbox' ? el.checked : parseFloat(el.value);
    if (valEl) valEl.textContent = fmt ? fmt(v) : v.toFixed(2);
    fn(v);
  });
}

function syncFromUI() {
  if (mode !== 'board') return;
  charContainer.visible = document.getElementById('charVis').checked;
  const s = parseFloat(document.getElementById('charScale').value);
  charContainer.scale.setScalar(s);
  charContainer.position.set(
    0.18 + parseFloat(document.getElementById('charX').value),
    0.93 + parseFloat(document.getElementById('charY').value),
    parseFloat(document.getElementById('charZ').value)
  );
  charContainer.rotation.y = parseFloat(document.getElementById('charRY').value) * Math.PI / 180;
}

bind('charVis', null, () => syncFromUI());
bind('charScale', 'charScaleV', () => syncFromUI());
bind('charX', 'charXV', () => syncFromUI());
bind('charY', 'charYV', () => syncFromUI());
bind('charZ', 'charZV', () => syncFromUI());
bind('charRY', 'charRYV', () => syncFromUI(), v => v + '°');

bind('animPlay', null, v => {
  if (currentAction) { v ? currentAction.play() : currentAction.stop(); }
});
bind('animSpeed', 'animSpeedV', v => {
  if (mixer) mixer.timeScale = v;
}, v => v.toFixed(1));

bind('boardVis', null, v => foilAsset.visible = (mode === 'board') && v);
bind('boardScale', 'boardScaleV', v => foilAsset.scale.setScalar(v));
bind('showGrid', null, v => grid.visible = v);
bind('showAxes', null, v => axes.visible = v);

let autoRotate = true; // start with auto-rotate in splash
bind('autoRot', null, v => autoRotate = v);
document.getElementById('autoRot').checked = true;

bind('sunEl', 'sunElV', () => updateSun(), v => v + '°');
bind('sunAz', 'sunAzV', () => updateSun(), v => v + '°');
bind('sunInt', 'sunIntV', v => sun.intensity = v);

function updateSun() {
  const el = parseFloat(document.getElementById('sunEl').value) * Math.PI / 180;
  const az = parseFloat(document.getElementById('sunAz').value) * Math.PI / 180;
  sun.position.set(Math.cos(el) * Math.sin(az) * 8, Math.sin(el) * 8, Math.cos(el) * Math.cos(az) * 8);
}
updateSun();

// ══════════════════════════════════════════════
// ORBIT CAMERA
// ══════════════════════════════════════════════
let camTheta = 0.5, camPhi = 1.2, camR = 4;
let target = new THREE.Vector3(0, 0.85, 0);
let isDrag = false, isPan = false, lastX = 0, lastY = 0;

renderer.domElement.addEventListener('mousedown', e => {
  if (e.button === 0) isDrag = true;
  if (e.button === 2) isPan = true;
  lastX = e.clientX; lastY = e.clientY;
});
window.addEventListener('mouseup', () => { isDrag = isPan = false; });
window.addEventListener('mousemove', e => {
  const dx = e.clientX - lastX, dy = e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY;
  if (isDrag) {
    camTheta -= dx * 0.005;
    camPhi = Math.max(0.1, Math.min(Math.PI - 0.1, camPhi + dy * 0.005));
    autoRotate = false;
    document.getElementById('autoRot').checked = false;
  }
  if (isPan) {
    const right = new THREE.Vector3();
    right.crossVectors(camera.getWorldDirection(new THREE.Vector3()), new THREE.Vector3(0,1,0)).normalize();
    target.x -= right.x * dx * 0.01;
    target.z -= right.z * dx * 0.01;
    target.y += dy * 0.01;
  }
});
renderer.domElement.addEventListener('wheel', e => {
  camR = Math.max(0.5, Math.min(30, camR * (1 + e.deltaY * 0.001)));
  e.preventDefault();
}, { passive: false });
renderer.domElement.addEventListener('contextmenu', e => e.preventDefault());

// ══════════════════════════════════════════════
// ANIMATE
// ══════════════════════════════════════════════
function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  if (mixer) mixer.update(dt);
  if (autoRotate) camTheta += 0.005;
  camera.position.x = target.x + camR * Math.sin(camPhi) * Math.cos(camTheta);
  camera.position.y = target.y + camR * Math.cos(camPhi);
  camera.position.z = target.z + camR * Math.sin(camPhi) * Math.sin(camTheta);
  camera.lookAt(target);
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
