<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Surfer + Board Viewer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { overflow: hidden; background: #1a2332; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: #c8d6e5; }
  canvas { display: block; }

  #panel {
    position: fixed; top: 16px; right: 16px; z-index: 10;
    width: 280px; background: rgba(8, 18, 38, 0.92);
    border: 1px solid rgba(100, 180, 255, 0.15);
    border-radius: 10px; padding: 14px 18px;
    backdrop-filter: blur(12px);
    max-height: calc(100vh - 32px); overflow-y: auto;
  }
  #panel h2 { font-size: 13px; color: #7cc4f5; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.8px; font-weight: 600; }
  .row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 7px; font-size: 11px; color: #8ab8d8; }
  .row label { flex: 0 0 90px; }
  .row input[type=range] { flex: 1; accent-color: #4af; height: 3px; }
  .row .val { flex: 0 0 48px; text-align: right; font-family: monospace; color: #5ea8d8; }
  .section { border-top: 1px solid rgba(100,180,255,0.1); margin-top: 12px; padding-top: 12px; }
  .section:first-child { border: none; margin: 0; padding: 0; }
  button { background: rgba(74,156,212,0.2); border: 1px solid rgba(74,156,212,0.4); color: #7cc4f5; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 11px; margin-right: 4px; margin-bottom: 4px; }
  button:hover { background: rgba(74,156,212,0.35); }
  button.active { background: rgba(74,156,212,0.5); color: #fff; }
  #info { position: fixed; bottom: 16px; left: 16px; z-index: 10; background: rgba(8,18,38,0.7); padding: 8px 14px; border-radius: 6px; font-size: 11px; font-family: monospace; color: #8ab8d8; }
  #info span { color: #7cc4f5; }
</style>
</head>
<body>

<div id="panel">
  <div class="section">
    <h2>Character</h2>
    <div class="row"><label>Pose</label>
      <button id="poseCrouch" class="active" onclick="setPose('crouch')">Crouch</button>
      <button id="poseStalled" onclick="setPose('stalled')">Stalled</button>
    </div>
    <div class="row"><label>Visible</label><input type="checkbox" id="charVis" checked style="flex:0;"></div>
    <div class="row"><label>Scale</label><input type="range" id="charScale" min="0.1" max="3" step="0.05" value="1.25"><span class="val" id="charScaleV">1.25</span></div>
    <div class="row"><label>X</label><input type="range" id="charX" min="-2" max="2" step="0.01" value="0.13"><span class="val" id="charXV">0.13</span></div>
    <div class="row"><label>Y</label><input type="range" id="charY" min="-1" max="3" step="0.01" value="0.88"><span class="val" id="charYV">0.88</span></div>
    <div class="row"><label>Z</label><input type="range" id="charZ" min="-2" max="2" step="0.01" value="0.10"><span class="val" id="charZV">0.10</span></div>
    <div class="row"><label>Rotation Y</label><input type="range" id="charRY" min="-180" max="180" step="1" value="-19"><span class="val" id="charRYV">-19°</span></div>
    <div class="row" style="margin-top:6px;"><button onclick="copySettings()" style="flex:1;">📋 Copy Settings</button><button onclick="resetPose()">↺ Reset</button></div>
    <div id="copyMsg" style="font-size:10px;color:#5ef0a0;margin-top:4px;min-height:12px;"></div>
  </div>

  <div class="section">
    <h2>Board</h2>
    <div class="row"><label>Visible</label><input type="checkbox" id="boardVis" checked style="flex:0;"></div>
    <div class="row"><label>Scale</label><input type="range" id="boardScale" min="0.5" max="2" step="0.05" value="1"><span class="val" id="boardScaleV">1.00</span></div>
  </div>

  <div class="section">
    <h2>Scene</h2>
    <div class="row"><label>Background</label>
      <button onclick="setBg(0)" class="active">Studio</button>
      <button onclick="setBg(1)">Sky</button>
      <button onclick="setBg(2)">Dark</button>
    </div>
    <div class="row"><label>Auto Rotate</label><input type="checkbox" id="autoRot" style="flex:0;"></div>
    <div class="row"><label>Show Grid</label><input type="checkbox" id="showGrid" checked style="flex:0;"></div>
    <div class="row"><label>Show Axes</label><input type="checkbox" id="showAxes" style="flex:0;"></div>
  </div>

  <div class="section">
    <h2>Lighting</h2>
    <div class="row"><label>Sun Angle</label><input type="range" id="sunEl" min="5" max="89" step="1" value="45"><span class="val" id="sunElV">45°</span></div>
    <div class="row"><label>Sun Dir</label><input type="range" id="sunAz" min="0" max="360" step="1" value="135"><span class="val" id="sunAzV">135°</span></div>
    <div class="row"><label>Intensity</label><input type="range" id="sunInt" min="0" max="3" step="0.05" value="1.4"><span class="val" id="sunIntV">1.40</span></div>
  </div>
</div>

<div id="info">
  <span>Surfer Viewer</span> · Drag to orbit · Scroll to zoom · Right-drag to pan<br>
  Triangles: <span id="tris">--</span> · Meshes: <span id="meshes">--</span>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script>
// ── Scene setup ──
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.set(3, 2.5, 4);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

// ── Background helpers ──
const bgColors = [
  new THREE.Color(0.45, 0.52, 0.6),  // studio gray-blue
  new THREE.Color(0.55, 0.75, 0.92), // sky
  new THREE.Color(0.06, 0.08, 0.13), // dark
];
scene.background = bgColors[0];
function setBg(i) {
  scene.background = bgColors[i];
  document.querySelectorAll('#panel button').forEach((b, idx) => b.classList.toggle('active', idx === i));
}
window.setBg = setBg;

// ── Grid + axes ──
const grid = new THREE.GridHelper(10, 20, 0x4a7a9e, 0x2a3a5e);
scene.add(grid);
const axes = new THREE.AxesHelper(1.5);
axes.visible = false;
scene.add(axes);

// ── Ground for shadow catching ──
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(20, 20),
  new THREE.ShadowMaterial({ opacity: 0.35 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.01;
ground.receiveShadow = true;
scene.add(ground);

// ── Lights ──
const ambient = new THREE.HemisphereLight(0xffffff, 0x444466, 0.55);
scene.add(ambient);
const sun = new THREE.DirectionalLight(0xffffff, 1.4);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 0.5;
sun.shadow.camera.far = 30;
sun.shadow.camera.left = -5;
sun.shadow.camera.right = 5;
sun.shadow.camera.top = 5;
sun.shadow.camera.bottom = -5;
scene.add(sun);

// ── Materials matching main project ──
const boardMat = new THREE.MeshStandardMaterial({ color: 0xf0f4f8, roughness: 0.4, metalness: 0.05 });
const carbonMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.35, metalness: 0.6 });

// ── Build hydrofoil + board (matches js/foil.js createFoilAsset) ──
function createFoilAsset() {
  const g = new THREE.Group();
  const boardLength = 1.1, bL = boardLength/2, bW = 0.3;
  const shape = new THREE.Shape();
  shape.moveTo(-bL, 0);
  shape.bezierCurveTo(-bL + 0.05, bW * 0.6, -bL + 0.2, bW * 0.95, -bL * 0.3, bW);
  shape.bezierCurveTo(bL * 0.3, bW * 0.95, bL - 0.12, bW * 0.5, bL, 0);
  shape.bezierCurveTo(bL - 0.12, -bW * 0.5, bL * 0.3, -bW * 0.95, -bL * 0.3, -bW);
  shape.bezierCurveTo(-bL + 0.2, -bW * 0.95, -bL + 0.05, -bW * 0.6, -bL, 0);
  const boardGeom = new THREE.ExtrudeGeometry(shape, {
    steps: 1, depth: 0.08, bevelEnabled: true, bevelThickness: 0.02, bevelSize: 0.02, bevelSegments: 3,
  });
  boardGeom.rotateX(-Math.PI/2);
  const board = new THREE.Mesh(boardGeom, boardMat);
  board.position.set(boardLength/6, 0.81, 0);
  board.castShadow = true; board.receiveShadow = true;
  g.add(board);

  const mast = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.85, 0.18), carbonMat);
  mast.position.set(0, 0.4, 0); mast.rotation.y = Math.PI/2;
  mast.castShadow = true; g.add(mast);

  const fuse = new THREE.Mesh(new THREE.BoxGeometry(0.75, 0.05, 0.05), carbonMat);
  fuse.position.set(-0.125, 0, 0); fuse.castShadow = true; g.add(fuse);

  const fWing = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.02, 1.1), carbonMat);
  fWing.position.set(0.25, 0, 0); fWing.scale.set(1,1,0.8); fWing.castShadow = true; g.add(fWing);

  const bWing = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.02, 0.4), carbonMat);
  bWing.position.set(-0.5, 0, 0); bWing.castShadow = true; g.add(bWing);

  return g;
}

const foilAsset = createFoilAsset();
scene.add(foilAsset);

// ── Pose presets (should match js/foil.js) ──
const POSE_PRESETS = {
  crouch:  { file: 'assets/surfer_crouch.glb',  scale: 1.25, x: 0.13,  y: 0.88, z: 0.10,  ry: -19 },
  stalled: { file: 'assets/surfer_stalled.glb', scale: 1.25, x: -0.02, y: 0.88, z: -0.05, ry: -2  },
};

// ── Load surfer GLBs (both poses, swap visibility) ──
const poseContainers = {}; // { crouch: Group, stalled: Group }
let activePose = 'crouch';

const loader = new THREE.GLTFLoader();

function loadPose(key) {
  const preset = POSE_PRESETS[key];
  const container = new THREE.Group();
  container.visible = (key === activePose);
  scene.add(container);
  poseContainers[key] = container;

  loader.load(preset.file, (gltf) => {
    const asset = gltf.scene;
    asset.traverse(o => {
      if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; }
    });
    // Auto-center horizontally, drop feet to y=0
    const box = new THREE.Box3().setFromObject(asset);
    const center = box.getCenter(new THREE.Vector3());
    asset.position.set(-center.x, -box.min.y, -center.z);
    container.add(asset);

    // If this is the active pose, update stats + push preset values into UI
    if (key === activePose) {
      updateStats(asset);
      loadPresetIntoUI(key);
    }
  }, undefined, (err) => {
    console.error('Failed to load ' + preset.file + ':', err);
    document.getElementById('info').innerHTML = '<span style="color:#f55">ERROR loading ' + preset.file + '</span> · Check console';
  });
}

function updateStats(asset) {
  let triCount = 0, meshCount = 0;
  asset.traverse(o => {
    if (o.isMesh) {
      meshCount++;
      const idx = o.geometry.index;
      triCount += idx ? idx.count / 3 : o.geometry.attributes.position.count / 3;
    }
  });
  document.getElementById('tris').textContent = Math.round(triCount).toLocaleString();
  document.getElementById('meshes').textContent = meshCount;
}

function loadPresetIntoUI(key) {
  const p = POSE_PRESETS[key];
  document.getElementById('charScale').value = p.scale;
  document.getElementById('charScaleV').textContent = p.scale.toFixed(2);
  document.getElementById('charX').value = p.x;
  document.getElementById('charXV').textContent = p.x.toFixed(2);
  document.getElementById('charY').value = p.y;
  document.getElementById('charYV').textContent = p.y.toFixed(2);
  document.getElementById('charZ').value = p.z;
  document.getElementById('charZV').textContent = p.z.toFixed(2);
  document.getElementById('charRY').value = p.ry;
  document.getElementById('charRYV').textContent = p.ry + '°';
  syncFromUI();
}

function setPose(key) {
  activePose = key;
  Object.keys(poseContainers).forEach(k => {
    if (poseContainers[k]) poseContainers[k].visible = (k === key);
  });
  document.getElementById('poseCrouch').classList.toggle('active', key === 'crouch');
  document.getElementById('poseStalled').classList.toggle('active', key === 'stalled');
  // Update stats + pull preset values for the newly selected pose
  const container = poseContainers[key];
  if (container && container.children[0]) updateStats(container.children[0]);
  loadPresetIntoUI(key);
}
window.setPose = setPose;

function resetPose() {
  loadPresetIntoUI(activePose);
  showCopyMsg('Reset to saved values');
}
window.resetPose = resetPose;

function copySettings() {
  const s = parseFloat(document.getElementById('charScale').value);
  const x = parseFloat(document.getElementById('charX').value);
  const y = parseFloat(document.getElementById('charY').value);
  const z = parseFloat(document.getElementById('charZ').value);
  const ry = parseInt(document.getElementById('charRY').value);
  const txt = `${activePose}: scale ${s.toFixed(2)}, pos (${x.toFixed(2)}, ${y.toFixed(2)}, ${z.toFixed(2)}), Y rot ${ry}°
container.scale.setScalar(${s});
container.position.set(${x}, ${y}, ${z});
container.rotation.y = ${ry} * Math.PI / 180;`;
  navigator.clipboard.writeText(txt).then(() => {
    showCopyMsg('✓ Copied to clipboard');
  }).catch(() => {
    showCopyMsg('Copy failed — check console');
    console.log(txt);
  });
}
window.copySettings = copySettings;

function showCopyMsg(text) {
  const el = document.getElementById('copyMsg');
  el.textContent = text;
  setTimeout(() => { el.textContent = ''; }, 2500);
}

// Load both poses up front
loadPose('crouch');
loadPose('stalled');

// ── UI bindings ──
function bind(id, valId, fn, fmt) {
  const el = document.getElementById(id);
  const valEl = valId ? document.getElementById(valId) : null;
  el.addEventListener('input', () => {
    const v = el.type === 'checkbox' ? el.checked : parseFloat(el.value);
    if (valEl) valEl.textContent = fmt ? fmt(v) : v.toFixed(2);
    fn(v);
  });
}

function syncFromUI() {
  const container = poseContainers[activePose];
  if (!container) return;
  container.visible = document.getElementById('charVis').checked;
  const s = parseFloat(document.getElementById('charScale').value);
  container.scale.setScalar(s);
  container.position.set(
    parseFloat(document.getElementById('charX').value),
    parseFloat(document.getElementById('charY').value),
    parseFloat(document.getElementById('charZ').value)
  );
  container.rotation.y = parseFloat(document.getElementById('charRY').value) * Math.PI / 180;
}

bind('charVis', null, () => syncFromUI());
bind('charScale', 'charScaleV', () => syncFromUI());
bind('charX', 'charXV', () => syncFromUI());
bind('charY', 'charYV', () => syncFromUI());
bind('charZ', 'charZV', () => syncFromUI());
bind('charRY', 'charRYV', () => syncFromUI(), v => v + '°');

bind('boardVis', null, v => foilAsset.visible = v);
bind('boardScale', 'boardScaleV', v => foilAsset.scale.setScalar(v));

bind('showGrid', null, v => grid.visible = v);
bind('showAxes', null, v => axes.visible = v);

let autoRotate = false;
bind('autoRot', null, v => autoRotate = v);

bind('sunEl', 'sunElV', () => updateSun(), v => v + '°');
bind('sunAz', 'sunAzV', () => updateSun(), v => v + '°');
bind('sunInt', 'sunIntV', v => sun.intensity = v);

function updateSun() {
  const el = parseFloat(document.getElementById('sunEl').value) * Math.PI / 180;
  const az = parseFloat(document.getElementById('sunAz').value) * Math.PI / 180;
  sun.position.set(
    Math.cos(el) * Math.sin(az) * 8,
    Math.sin(el) * 8,
    Math.cos(el) * Math.cos(az) * 8
  );
}
updateSun();

// ── Orbit controls (minimal) ──
let camTheta = Math.atan2(camera.position.z, camera.position.x);
let camPhi = Math.acos(camera.position.y / camera.position.length());
let camR = camera.position.length();
let target = new THREE.Vector3(0, 1.0, 0);
let isDrag = false, isPan = false, lastX = 0, lastY = 0;

renderer.domElement.addEventListener('mousedown', e => {
  if (e.button === 0) isDrag = true;
  if (e.button === 2) isPan = true;
  lastX = e.clientX; lastY = e.clientY;
});
window.addEventListener('mouseup', () => { isDrag = isPan = false; });
window.addEventListener('mousemove', e => {
  const dx = e.clientX - lastX, dy = e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY;
  if (isDrag) {
    camTheta -= dx * 0.005;
    camPhi = Math.max(0.1, Math.min(Math.PI - 0.1, camPhi + dy * 0.005));
  }
  if (isPan) {
    const right = new THREE.Vector3();
    right.crossVectors(camera.getWorldDirection(new THREE.Vector3()), new THREE.Vector3(0,1,0)).normalize();
    target.x -= right.x * dx * 0.01;
    target.z -= right.z * dx * 0.01;
    target.y += dy * 0.01;
  }
});
renderer.domElement.addEventListener('wheel', e => {
  camR = Math.max(0.5, Math.min(30, camR * (1 + e.deltaY * 0.001)));
  e.preventDefault();
}, { passive: false });
renderer.domElement.addEventListener('contextmenu', e => e.preventDefault());

// ── Animate ──
function animate() {
  requestAnimationFrame(animate);
  if (autoRotate) camTheta += 0.005;
  camera.position.x = target.x + camR * Math.sin(camPhi) * Math.cos(camTheta);
  camera.position.y = target.y + camR * Math.cos(camPhi);
  camera.position.z = target.z + camR * Math.sin(camPhi) * Math.sin(camTheta);
  camera.lookAt(target);
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
